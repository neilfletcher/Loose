<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Loose! A Company of Archers</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JF54HQGVLT"></script>

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: gritty campaign ledger, gallows humour, idle-game snap
IDEA: a captain's muster book in a soaked camp in 1415, numbers always going up
PICTURE: the top-down battlefield running on its own; portraits drawn from the same sprites
COLOUR and TYPE: deep field green, St George red, gilt for rarity; IM Fell for titles, Alegreya Sans for the rest
LAYOUT: phone column, resource strip at the top, tabs at the bottom
*/
:root{--bg:#10140f;--p:#192117;--p2:#212b1e;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c;
--r0:#aeaca2;--r1:#72c35d;--r2:#55a2ea;--r3:#b874ea;--r4:#f2b233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 "Alegreya Sans",system-ui,sans-serif;overflow:hidden}
body{background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.fell{font-family:"IM Fell English SC",Georgia,serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:8px 12px 6px;border-bottom:1px solid var(--line);background:#0d110c}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-family:"IM Fell English SC",serif;font-size:22px;line-height:1}
.logo b{color:var(--red)}
.rank{font-size:12.5px;color:var(--mut);flex:1}
.ib{width:32px;height:32px;border-radius:2px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-size:15.5px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-top:7px}
.rc{background:var(--p);border:1px solid var(--line);border-radius:2px;padding:3px 6px 4px;line-height:1.2;overflow:hidden}
.rc b{display:block;font-size:14px;white-space:nowrap;letter-spacing:-.01em}
.rc span{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.rc i{display:block;height:3px;border-radius:2px;background:#2a3426;margin-top:3px;overflow:hidden}
.rc i s{display:block;height:100%;background:#7fae5a;text-decoration:none}
.rc.full b{color:#e9988c}.rc.full i s{background:#e0503e}
@media (min-width:480px){.res{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.rc b{font-size:14.5px}}
main{flex:1;overflow-y:auto;padding:4px 12px 20px;position:relative}
#battleView{position:absolute;inset:0;display:flex;flex-direction:column;padding:0}
nav{display:flex;border-top:1px solid var(--line);background:#0c100b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 0 8px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav button.hide{display:none}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:9px;height:9px;border-radius:2px;background:var(--red);box-shadow:0 0 0 2px #0c100b}
h2{font-family:"IM Fell English SC",serif;font-weight:400;font-size:24px;margin:12px 0 2px}
h3{font-family:"IM Fell English SC",Georgia,serif;font-size:16px;font-weight:400;color:#c9b88f;margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sub{color:var(--mut);font-size:14px}
.sub b{color:var(--ink)}
.card{background:var(--p);border:1px solid var(--line);border-radius:2px;padding:11px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{background:var(--p2);border:1px solid #3d4b38;border-radius:2px;padding:7px 11px;font-weight:700;white-space:nowrap;min-height:38px;font-size:14.5px;line-height:1.15}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.85}
.btn.gold{background:#d29f3b;color:#1d1408;border-color:#a77a24}
.btn.red{background:#b3342a;color:#fff;border-color:#86251d}
.btn.ghost{color:#e9988c;border-color:#5a2a24}
.btn:disabled{opacity:.38;cursor:default}
.big{width:100%;padding:13px;font-size:16px}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);margin:3px 3px 0 0;color:var(--mut)}
.pill.g{color:#a8dd8e;border-color:#3e6a2e;background:#18240f}
.pill.b{color:#e9988c;border-color:#5a2a24;background:#24120f}
.stars{color:var(--gold);font-size:12.5px;letter-spacing:-1px}
.pt{width:50px;height:50px;border-radius:2px;flex:none;display:block}
.nm{font-weight:700}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.bar{height:5px;border-radius:2px;background:#2a3426;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}
.lock{opacity:.45}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:#2a3526;color:var(--mut)}
/* battle */
.bhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d110c;border-bottom:1px solid var(--line)}
.bhead .t{font-family:"IM Fell English SC",serif;font-size:19px;line-height:1.05}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:200px}
#cv{display:block;border-radius:2px}
#bMsg{position:absolute;top:28%;left:0;right:0;text-align:center;pointer-events:none;font-family:"IM Fell English SC",serif;font-size:28px;color:#fff3d6;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.92)}
#bMsg.on{opacity:1;transform:scale(1)}
#bMsg small{display:block;font-family:"Alegreya Sans";font-size:14.5px;color:#e8dcc0}
.bfoot{background:#0d110c;border-top:1px solid var(--line);padding:8px 12px}
.bfoot .row>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bfoot .tog{white-space:nowrap}
.prog{height:7px;border-radius:2px;background:#2a1a14;overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:var(--red)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--mut)}
.sw{width:18px;height:18px;border:2px solid #7a6640;background:transparent;position:relative;flex:none}
.sw:after{content:"";position:absolute;display:none;left:4px;top:0;width:5px;height:10px;border:solid #1d1408;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sw.on{background:var(--gold);border-color:var(--gold)}.sw.on:after{display:block}
.news{outline:2px solid var(--gold);outline-offset:-2px}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,182,76,.35)}}
/* formation */
.form{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:2px;border:2px dashed #3d4b38;display:grid;place-items:center;position:relative;cursor:pointer;background:#141a12;overflow:hidden}
.slot img{width:100%;height:100%;display:block}
.slot.f{border-color:#6e3326}
.slot.x{opacity:.3;cursor:default}
.slot .lv{position:absolute;bottom:1px;right:3px;font-size:11.5px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .w{position:absolute;inset:0;background:rgba(80,10,5,.55);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.slot.pick{border-style:solid;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pk{background:var(--p);border:2px solid var(--line);border-radius:2px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pk .pt{margin:0 auto 4px;width:58px;height:58px}
.pk small{display:block;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.off{opacity:.35;cursor:default}
.pk.sel{border-color:var(--gold);background:#2a2614}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
#modal.show{display:block}
#sheet{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;max-height:90%;overflow-y:auto;background:#151c13;border:1px solid var(--line);border-radius:4px 4px 0 0;padding:8px 16px 22px}
.handle{width:42px;height:4px;border-radius:2px;background:#3d4b38;margin:4px auto 10px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat4 div{background:#0f140e;border:1px solid var(--line);border-radius:2px;padding:6px;text-align:center}
.stat4 b{display:block;font-size:16.5px}.stat4 span{font-size:11px;color:var(--mut);letter-spacing:.05em}
.bio{font-family:Georgia,serif;font-style:italic;color:#c7c0ad;font-size:15.5px;margin:8px 0}
.ev{font-family:Georgia,serif;font-size:16.5px;line-height:1.55;color:#ddd5c2}
.tav{border-radius:2px;padding:14px;background:#2a1d10;border:1px solid #5a3d1e;margin-top:8px}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.odds span{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:2px;background:rgba(0,0,0,.3)}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.cd{perspective:600px;height:132px}
.cd .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.cd.open .in{transform:rotateY(180deg)}
.cd .fc,.cd .bk{position:absolute;inset:0;border-radius:2px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.cd .bk{background:repeating-linear-gradient(45deg,#3a2614 0 6px,#2c1c0e 6px 12px);border:2px solid #6a4a24;font-family:"IM Fell English SC",serif;font-size:28px;color:#8a6a3a}
.cd .fc{transform:rotateY(180deg);background:#151c13;border:2px solid}
.cd .fc .pt{width:56px;height:56px;margin-bottom:4px}
.cd .fc small{font-size:12.5px;line-height:1.2}
.cd.r4 .fc{border-width:3px}
.cd.r3 .fc{border-width:3px}
.bico{width:44px;height:44px;border-radius:2px;background:#0f140e;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:20px}
.cost{font-size:12.5px;color:var(--mut)}
.cost .no{color:#e9988c}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.days div{border:1px solid var(--line);border-radius:2px;padding:5px 2px;text-align:center;font-size:11.5px;color:var(--mut)}
.days div.got{background:#2a2614;border-color:var(--gold);color:var(--gold)}
.days div.now{border-color:var(--red);color:var(--ink)}
.perk .lvl{font-weight:800;color:var(--gold)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#2a1712;border:1px solid #6e3326;color:#f3c3b5;padding:9px 16px;border-radius:2px;font-size:14.5px;z-index:80;display:none;max-width:90%;text-align:center}
#toast.ok{background:#18240f;border-color:#3e6a2e;color:#cfe8b8}
#tut{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#2a2614;border-top:1px solid #6a5424;font-size:14.5px;line-height:1.35}
#tut b{color:var(--gold)}
nav button.tutp{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold);border-radius:2px}
.nmin{width:100%;padding:7px 9px;border-radius:2px;background:#0f140e;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;font-weight:700}
.sw2{display:inline-block;width:30px;height:30px;border-radius:2px;border:2px solid var(--line);cursor:pointer;margin:2px}
.sw2.on{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
.gearrow{display:flex;gap:5px;margin-top:6px;align-items:center}
.gc{width:34px;height:34px;border-radius:2px;display:grid;place-items:center;font-size:16px;background:#0f140e;border:2px solid var(--line);cursor:pointer;position:relative}
.gc.e{border-style:dashed;border-color:#6e3326;opacity:.8}
.gc.e.can{border-color:var(--gold);opacity:1}
.gc.e:after{content:"+";position:absolute;font-size:14.5px;font-weight:800;color:#e9988c}
.gc.e.can:after{color:var(--gold)}
.gc span{filter:saturate(1.2)}
.eqrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #22301f}
.eqrow:last-child{border-bottom:0}
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib .ic{width:18px;height:18px;vertical-align:0}
.btn.gold .ic,.btn.red .ic,.days div.got .ic{color:inherit!important}
.bico .ic{width:24px;height:24px}
.gc .ic{width:18px;height:18px}
.eqrow img{width:34px;height:34px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow"><div class="logo">Loose<b>!</b></div><div class="rank" id="rank"></div><button class="ib" id="snd" aria-label="Sound"></button><button class="ib" id="setBtn" aria-label="Settings"></button></div>
    <div class="res" id="res"></div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="battle"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M14 4h6v6M4 20l3-1M4 20l1-3"/></svg>Battle</button>
    <button data-tab="camp"><svg viewBox="0 0 24 24"><path d="M2 20L12 4l10 16zM12 4v16M9 20l3-5 3 5"/></svg>Camp</button>
    <button data-tab="company"><svg viewBox="0 0 24 24"><path d="M7 3c9 4 9 14 0 18M7 3v18M4 12h16"/></svg>Company</button>
    <button data-tab="tavern"><svg viewBox="0 0 24 24"><path d="M5 8h10v12H5zM15 11h3v6h-3M5 8c0-4 10-4 10 0"/></svg>Tavern</button>
    <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7"/></svg>Orders</button>
    <button data-tab="study"><svg viewBox="0 0 24 24"><path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4zM20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg>Study</button>
    <button data-tab="legacy"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg>Legacy</button>
  </nav>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
{
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  if (n < 10) return (Math.round(n * 10) / 10).toString(); if (n < 1000) return Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3); if (e >= SUF.length) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, e); return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUF[e];
}
function fmtT(s){ s = Math.max(0, Math.round(s)); if (s < 60) return s + 's'; if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's'; return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm'; }

const base = a => a.cls === 'hero' ? HEROES[a.hero] : CLS[a.cls];
const look = a => Object.assign({rar:RAR[a.rar].c, st:a.stars}, base(a).look);
function pickTrait(goodP, have){
  const keys = Object.keys(TRAITS).filter(k => !have.includes(k)), g = keys.filter(k => TRAITS[k].g), b = keys.filter(k => !TRAITS[k].g);
  return (Math.random() < goodP || !b.length) ? pick(g) : pick(b);
}
function genName(cls){
  if (cls === 'welsh') return pick(WFIRST) + ' ' + pick(WLAST);
  if (cls === 'genoese') return pick(GFIRST) + ' ' + pick(GLAST);
  const f = pick(FIRST); return Math.random() < .22 ? `${f} ${pick(NICK)}` : `${f} ${pick(LAST)}`;
}
function genBio(cls){
  if (cls === 'genoese') return pick(['Crossbowman from Genoa, paid in advance. Thinks the English food is a war crime.','Changed sides twice last year. Currently on yours.','Mercenary. Will not discuss which side he was on at Nicopolis.']);
  if (cls === 'welsh') return pick(['From the Marches. Fought against the English under Glyndŵr, now fights for them. Prefers not to talk about it.','Gwent bowman. Faster than your Englishmen and makes sure they know it.','Hill farmer from Brecon. Sings, constantly, beautifully, and it is driving everyone mad.']);
  return pick(ORIGIN) + '. ' + pick(QUIRK);
}
function newArcher(rar, cls, hero){
  const a = {id:uid(), rar, cls, lvl:1, stars:RAR[rar].st, traits:[], kills:0, woundT:0, away:null, gear:{}, kt:{}};
  if (cls === 'hero') { a.hero = hero; a.name = HEROES[hero].n; a.bio = HEROES[hero].bio; a.traits = [pickTrait(1, [])]; a.traits.push(pickTrait(1, a.traits)); }
  else { a.name = genName(cls); a.bio = genBio(cls); const n = rar >= 2 ? 2 : 1; for (let i = 0; i < n; i++) a.traits.push(pickTrait(.45 + rar * .14, a.traits)); }
  return a;
}

function dmgMult(){ return Math.pow(1.25, L('drill')) * (1 + .1 * B_('bowyer')) * Math.pow(2, Math.floor(B_('bowyer') / 10)) * codexDmg() * (R('a1') ? 1.15 : 1) * (R('a4') ? 1.3 : 1) * (R('a6') ? 1.6 : 1) * Math.pow(2, G('twin')); }
function stats(a){
  const b = base(a), t = a.traits, sm = Math.pow(1.4, a.stars - 1), g = gearOf(a);
  const dmg = b.dmg * lvMul(a.lvl) * sm * (t.includes('strong') ? 1.15 : 1) * (t.includes('steady') ? 1.08 : 1) * (t.includes('drunk') ? .9 : 1) * dmgMult() * (1 + (g.bow ? g.bow.v : 0) / 100) * (1 + (g.head ? g.head.v / 2 : 0) / 100) * (a.nick ? 1.05 : 1);
  const int = b.int / ((t.includes('quick') ? 1.12 : 1) * (t.includes('nervous') ? .9 : 1) * (1 + (g.charm ? g.charm.v / 2 : 0) / 100) * (R('a3b') ? 1.15 : 1));
  const hp = b.hp * (1 + .25 * (a.lvl - 1)) * Math.pow(2, Math.floor(a.lvl / 25)) * Math.pow(1.3, a.stars - 1) * (t.includes('tough') ? 1.3 : 1) * (t.includes('drunk') ? 1.1 : 1) * Math.pow(1.3, L('iron')) * (1 + .04 * B_('surgeon')) * (1 + (g.armour ? g.armour.v : 0) / 100) * codexHp() * (R('c1') ? 1.15 : 1) * (R('c3b') ? 1.1 : 1);

}
function lvlCost(a, n){
  let s = 0, f = 0; const fr = a.traits.includes('frugal') ? .9 : 1, gl = a.traits.includes('glutton') ? 1.15 : 1;
  for (let i = 0; i < n; i++) { const l = a.lvl + i; s += 10 * Math.pow(1.08, l - 1) * fr; f += 8 * Math.pow(1.08, l - 1) * fr * gl; }

function promoteCost(a){ return {medals:Math.round(3 * a.stars * (a.rar + 1)), iron:Math.round(50 * Math.pow(1.6, a.stars))}; }
const MAXSTARS = 7;
function slotsOpen(){ return Math.min(10, 3 + B_('barracks')); }
function rosterCap(){ return 12 + 2 * B_('barracks') + 2 * B_('tavern'); }
const fit = a => a && !a.woundT && !a.away;
function lineUp(){
  const out = [], used = new Set();

    const open = slotOpen(i); if (!open) { out.push(null); continue; }
    const a = S.roster.find(x => x.id === S.form[i]);
    if (fit(a)) { out.push(a); used.add(a.id); } else out.push(null);
  }
  if (S.autoRes) {
    const reserves = S.roster.filter(a => fit(a) && !used.has(a.id) && !S.form.includes(a.id)).sort((p, q) => power(q) - power(p));
    for (let i = 0; i < 10; i++) if (slotOpen(i) && !out[i] && S.form[i] && reserves.length) out[i] = reserves.shift();
  }
  return out;
}
function slotOpen(i){ const n = slotsOpen(); const order = [0,5,1,6,2,7,3,8,4,9]; return order.indexOf(i) < n; }
const power = a => { const s = stats(a); return s.dps * Math.sqrt(s.hp); };

/* ================= economy ================= */
function bCost(k){ const b = BLD[k], l = B_(k), o = {}; for (const r in b.cost) o[r] = b.cost[r] * Math.pow(b.g, l); if (k === 'tavern') {} return o; }
function canPay(c){ for (const r in c) if ((S.res[r] || 0) < c[r] - 1e-9) return false; return true; }
function pay(c){ for (const r in c) S.res[r] -= c[r]; }
function costHtml(c){ return Object.keys(c).map(r => `<span class="${(S.res[r] || 0) < c[r] ? 'no' : ''}">${RES[r].i}${fmt(c[r])}</span>`).join(' '); }
function storeCap(r){ const c = 1000 * Math.pow(1.4, B_('store')) * (R('l3a') ? 2 : 1); return r === 'arrows' ? c * 2 : c; }
const prodMult = () => Math.pow(1.3, L('charter')) * codexProd() * (R('l6') ? 2 : 1);
function rate(k){ const b = BLD[k], l = B_(k); return l ? b.rate * l * Math.pow(2, Math.floor(l / 25)) * prodMult() * resMult(b.prod) : 0; }
const clearBonus = N => 4 * Math.pow(1.095, N - 1);
function marketRate(){ return B_('market') ? .01 * B_('market') * clearBonus(S.runMax) * prodMult() : 0; }
function fletchRate(){ return B_('fletcher') * 1.0 * prodMult() * (R('l4') ? 1.5 : 1); }
const ARROW_IN = {wood:.6, feathers:.4, iron:.15};
const arrowsOn = () => B_('fletcher') > 0;
const arrowBonus = () => arrowsOn() && S.res.arrows >= 1 ? 1.5 : 1;
function addRes(r, v){
  if (!CAPPED.includes(r)) { S.res[r] = (S.res[r] || 0) + v; return; }
  const c = storeCap(r), room = c - S.res[r];
  if (v <= room) S.res[r] += v; else { S.res[r] = Math.max(S.res[r], c); if (B_('market') && v > room) S.res.silver += (v - Math.max(0, room)) * .02 * B_('market') * Math.pow(1.06, S.runMax); }
}
function econTick(dt){
  for (const k of ['farm','woodcut','mine','geese','scriptorium']) { const b = BLD[k]; if (B_(k)) addRes(b.prod, rate(k) * dt); }
  S.res.silver += marketRate() * dt;
  if (B_('fletcher')) {
    let n = fletchRate() * dt; for (const r in ARROW_IN) n = Math.min(n, S.res[r] / ARROW_IN[r]);
    n = Math.min(n, storeCap('arrows') - S.res.arrows); if (n > 0) { for (const r in ARROW_IN) S.res[r] -= n * ARROW_IN[r]; S.res.arrows += n; }
  }
  S.roster.forEach(a => { if (a.woundT) a.woundT = Math.max(0, a.woundT - dt); });
  if (B_('butts')) { S.buttsT += dt; const per = 240 / B_('butts'); while (S.buttsT >= per) { S.buttsT -= per; const ln = lineUp().filter(a => a && a.lvl < cap(a)); if (ln.length) { const a = pick(ln); a.lvl++; } } }
  extraTick(dt);
}
function writPrice(){ return Math.round(80 * Math.pow(1.095, S.runMax - 1) * (1 - .05 * B_('tavern')) * Math.pow(1.05, S.writBuys)); }

/* ================= stage generation ================= */
const zoneOf = N => ZONES[Math.floor((N - 1) / 10) % ZONES.length];
const cycleOf = N => Math.floor((N - 1) / (10 * ZONES.length));
function stageName(N){ const z = zoneOf(N), c = cycleOf(N); return z.n + (c ? ' ' + ['', 'II', 'III', 'IV', 'V', 'VI'][Math.min(c, 5)] : ''); }
const isBoss = N => N % 10 === 0;
const HU = N => 20 * Math.pow(1.15, N - 1);
const DU = N => 2 * Math.pow(1.045, N - 1);
function genStage(N, ev){
  const z = zoneOf(N), sp = ev ? null : SP(N), rng = mulberry(N * 7919 + 13 + (ev ? 5 : 0)), n = Math.min(24, 6 + Math.floor(N / 3)), pool = Object.entries(ev ? ev.mix : sp ? sp.mix : z.mix);
  const tot = pool.reduce((s, p) => s + p[1], 0), out = [];
  for (let i = 0; i < n; i++) { let r = rng() * tot, ty = pool[0][0]; for (const [k, w] of pool) { r -= w; if (r <= 0) { ty = k; break; } } out.push({t:.6 + i * .8, type:ty}); }
  if (ev ? (ev.rule === 'bosses' ? evState().stage % 5 === 0 : evState().stage % 10 === 0) : isBoss(N)) out.push({t:.6 + n * .4, type:'boss'});
  out.sort((a, b) => a.t - b.t);
  return out;
}
function stageHp(N){ return genStage(N).reduce((s, e) => s + EN[e.type].hp * HU(N), 0) * (SP(N) && SP(N).id === 'rain' ? .7 : 1); }
function stageArm(N){ const g = genStage(N); return g.reduce((s, e) => s + EN[e.type].arm * EN[e.type].hp, 0) / g.reduce((s, e) => s + EN[e.type].hp, 0); }
function stageReward(N){ const g = genStage(N); const kills = g.reduce((s, e) => s + EN[e.type].pay, 0) * .6 * Math.pow(1.095, N - 1); return (kills + clearBonus(N) * (isBoss(N) ? 4 : 1) * (SP(N) ? 3 : 1)) * silverMult(); }
function silverMult(){ const greedy = lineUp().filter(a => a && a.traits.includes('greedy')).length; return Math.pow(1.3, L('tax')) * (1 + .05 * greedy) * codexSilver() * (R('c6') ? 2 : 1); }
function squadDps(N){
  const arm = stageArm(N), ln = lineUp();
  let d = 0; ln.forEach((a, i) => { if (!a) return; const s = stats(a); d += s.dps * rankMult(i) * (1 - arm * (1 - s.pierce)); });
  d *= arrowBonus();
  return d * (1 + .03 * B_('drill'));
}
const reqDps = N => stageHp(N) / 60;
function spoils(N, mul){
  const m = Math.pow(1.07, N) * (mul || 1);
  addRes('wood', 3 * m); if (N >= 5) { addRes('iron', 1 * m); addRes('feathers', 1.5 * m); } addRes('food', 2 * m);
}

function newQuest(){
  const have = S.quests.map(q => q.t);

/* ---------- cloud save ---------- */
let fbAuth = null, fbDb = null, fbUser = null, cloudState = 'off', cloudMsg = '', cloudChoice = null;
function initCloud(){
  if (!window.firebase || !firebase.initializeApp) { cloudState = 'unavailable'; return; }
  try { if (!firebase.apps.length) firebase.initializeApp(FB); fbAuth = firebase.auth(); fbDb = firebase.firestore(); cloudState = 'ready';
    fbAuth.onAuthStateChanged(u => { fbUser = u; if (u) onSignedIn(); refreshSheet(); }); } catch(e) { cloudState = 'unavailable'; }
}
function signIn(){ if (!fbAuth) return; fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => { cloudMsg = e.code === 'auth/popup-blocked' ? 'Your browser blocked the sign-in window. Allow pop-ups and try again.' : 'Sign-in did not work: ' + (e.message || e.code); refreshSheet(); }); }
const DEV = (() => { try { let d = localStorage.getItem('loose-device'); if (!d) { d = uid(); localStorage.setItem('loose-device', d); } return d; } catch(e) { return uid(); } })();
const syncAt = {get(){ try { return +localStorage.getItem('loose-sync') || 0; } catch(e) { return 0; } }, set(v){ try { localStorage.setItem('loose-sync', String(v)); } catch(e){} }};
let lastInput = 0, cloudDoc = null, unsubCloud = null, syncing = false;
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => lastInput = Date.now(), true));
const isActive = () => !document.hidden && Date.now() - lastInput < 120000;
/* SYNC RULE: the save that is further along always wins. Progress = stages cleared (live and offline), kills break ties.
   Both only ever go up, so whichever is higher has been played more. The losing save is always kept as a backup. */
const progOf = o => o && o.stats ? (o.stats.clears || 0) + (o.stats.kills || 0) / 1e9 : 0;
/* a is ahead of b if it began later (start over / save code), or same start and more progress */
const ahead = (a, b) => { if (!a) return false; if (!b) return true; const ea = a.epochAt || 0, eb = b.epochAt || 0; return ea !== eb ? ea > eb : progOf(a) > progOf(b); };
const docObj = d => { try { return JSON.parse(d.data); } catch(e) { return null; } };
const fromOther = d => d && d.device !== DEV && d.updated > syncAt.get();
function keepBackup(o, why){ try { if (!o || !o.stats) return; const prev = JSON.parse(localStorage.getItem('loose-backup') || 'null'); if (prev && progOf(JSON.parse(prev.data)) > progOf(o) && Date.now() - prev.at < 7 * 864e5) return; localStorage.setItem('loose-backup', JSON.stringify({data:JSON.stringify(o), at:Date.now(), why, best:o.bestEver, stage:o.stage, clears:o.stats.clears || 0, kills:o.stats.kills || 0})); } catch(e){} }
function adoptCloud(d, why){
  try {
    const data = docObj(d); if (!data) return; keepBackup(S, why || 'Replaced by a save from another device'); syncAt.set(d.updated);
    S = Object.assign(defaultSave(), data); migrate(); bgKey = '';
    const gap = (Date.now() - d.updated) / 1000; if (gap > 30) offlineSim(gap);
    S.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(S));
    closeSheet(); newBattle(); render(); toast(`Loaded your save from another device (stage ${S.stage}). The one it replaced is in Settings, Backups.`, true); cloudMsg = 'Synced.';
  } catch(e) {}
}
/* one sync step: compare with the cloud and move whichever way is forward. force:'override' always uploads. */
async function cloudSync(force){
  if (!fbUser || !fbDb || syncing) return;
  syncing = true;
  try {
    save(); const ref = fbDb.collection('loose_saves').doc(fbUser.uid), mine = JSON.stringify(S), myP = progOf(S);
    const res = await fbDb.runTransaction(async t => {
      const snap = await t.get(ref), d = snap.exists ? snap.data() : null, theirs = d ? docObj(d) : null, theirP = progOf(theirs);
      if (d && force !== 'override') {
        if (ahead(theirs, S)) return {adopt:d};
        if (!ahead(S, theirs)) return {same:d};
      }
      const now = Date.now(), rec = {data:mine, updated:now, device:DEV, best:S.bestEver, stage:S.stage, prestiges:S.prestiges, clears:S.stats.clears || 0, kills:S.stats.kills || 0, v:VERSION};
      rec.backup = d && d.device !== DEV && d.data ? d.data : d && d.backup ? d.backup : null;
      t.set(ref, rec); return {now, rec};
    });
    if (res.adopt) { cloudDoc = res.adopt; if (isActive() && force !== 'load') { pendingAdopt = res.adopt; } else adoptCloud(res.adopt); return; }
    if (res.same) { cloudDoc = res.same; syncAt.set(Math.max(syncAt.get(), res.same.updated)); return; }
    syncAt.set(res.now); S.cloudAt = res.now; cloudDoc = res.rec;
  } finally { syncing = false; }
}
let pendingAdopt = null;
const cloudUpload = f => cloudSync(f === 'override' ? 'override' : undefined);
async function onSignedIn(){
  gtag('event', 'login'); cloudMsg = 'Syncing...'; refreshSheet();
  try {
    let force; try { force = localStorage.getItem('loose-force') ? 'override' : 'load'; localStorage.removeItem('loose-force'); } catch(e) { force = 'load'; }
    await cloudSync(force);
    const ref = fbDb.collection('loose_saves').doc(fbUser.uid);
    if (unsubCloud) unsubCloud();
    unsubCloud = ref.onSnapshot(sn => { if (!sn.exists) return; const d = sn.data(); cloudDoc = d; if (d.device !== DEV && ahead(docObj(d), S)) { if (isActive()) pendingAdopt = d; else adoptCloud(d); } }, () => {});
    cloudMsg = 'Synced. This account keeps every signed-in device up to date.';
  } catch(e) { cloudMsg = e.code === 'permission-denied' ? 'Signed in, but the cloud database is not open yet. Your game is still saved on this device.' : 'Could not reach the cloud: ' + (e.message || e.code); }
  refreshSheet();
}

document.addEventListener('visibilitychange', () => { if (fbUser) cloudSync(document.hidden ? undefined : 'load').catch(() => {}); });

const featuredHero = () => { const k = Object.keys(HEROES); return k[weekNo() % k.length]; };

let mus = null;
function musicStart(){
  if (!AC || mus || !S.music || !S.sound || document.hidden) return;
  const a = AC, g = a.createGain(); g.gain.value = .045; g.connect(a.destination);
  mus = {g, next:a.currentTime + .4, step:0, note:4};
}
function musicStop(){ if (!mus) return; try { mus.g.disconnect(); } catch(e){} mus = null; }
function pluck(t, f, v){ const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v || .3, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .9); o.connect(g); g.connect(mus.g); o.start(t); o.stop(t + 1); }

function musicTick(){
  if (!S.music || !S.sound || document.hidden) { musicStop(); return; }
  if (!mus) musicStart(); if (!mus) return;
  const intense = tab === 'battle' && BT && BT.phase === 'fight' && (isBoss(BT.N) || BT.sp || BT.en.some(e => e.d.boss)), beat = intense ? .3 : .52, scale = [0, 2, 3, 5, 7, 9, 10, 12, 14, 15];
  while (mus.next < AC.currentTime + .35) {
    const t = mus.next;
    if (mus.step % (intense ? 2 : 4) === 0) drum(t, intense ? .55 : .32);
    if (intense && mus.step % 4 === 3) drum(t, .25);
    if (mus.step % 2 === 0 && Math.random() < .72) { mus.note = clamp(mus.note + pick([-2, -1, -1, 1, 1, 2, 0]), 0, scale.length - 1); pluck(t, 293.66 * Math.pow(2, scale[mus.note] / 12), .26); if (Math.random() < .25) pluck(t, 146.83 * Math.pow(2, scale[clamp(mus.note - 2, 0, 9)] / 12), .14); }

}

/* ================= battle engine ================= */
const W = 360, H = 560, SPR = 1.3;
let BT = null, bg = null, bgKey = '';
function buildPath(pts){
  const P = pts.map(p => [p[0] * W, p[1] * H]), out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < 1; s += .05) { const s2 = s * s, s3 = s2 * s; out.push([0, 1].map(j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * s + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * s2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * s3))); }
  }
  out.push(P[P.length - 1]);
  const len = [0]; for (let i = 1; i < out.length; i++) len.push(len[i - 1] + dist(out[i][0], out[i][1], out[i - 1][0], out[i - 1][1]));

}
function pathAt(p, s){
  s = clamp(s, 0, p.total); let i = 1; while (i < p.len.length - 1 && p.len[i] < s) i++;
  const a = p.pts[i - 1], b = p.pts[i], seg = (p.len[i] - p.len[i - 1]) || 1, f = (s - p.len[i - 1]) / seg, dx = (b[0] - a[0]) / seg, dy = (b[1] - a[1]) / seg;
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, -dy, dx];
}
const PATHS = LAYOUTS.map(buildPath);
const SLOTS = PATHS.map(p => {
  const fr = [.5, .6, .7, .8, .9], out = [];
  for (let row = 0; row < 2; row++) fr.forEach((f, i) => {
    let side = i % 2 ? 1 : -1; const a = pathAt(p, p.total * (f - row * .03)), off = row ? 82 : 34;
    let x = a[0] + a[2] * off * side, y = a[1] + a[3] * off * side;
    if (x < 18 || x > W - 18 || y > H - 18) { side = -side; x = a[0] + a[2] * off * side; y = a[1] + a[3] * off * side; }
    out.push([clamp(x, 18, W - 18), clamp(y, 40, H - 18)]);

function newBattle(){

  BT = {N, z:zoneOf(N), sp, li, path:PATHS[li], slots:SLOTS[li], t:0, phase:'fight', units:[], en:[], arrows:[], fx:[], decals:BT && BT.li === li ? BT.decals.filter(d => !d.arrow).slice(-40) : [],
    ev, spawns:genStage(N, ev), spawnI:0, camp:100, volleyCD:6, volleys:[], streaks:[], stones:[], kills:0, endT:0, shake:0, noArrows:false, silver:0};
  const pav = B_('pavise') * supMult();
  ln.forEach((a, i) => { if (!a) return; const s = stats(a); const [x, y] = BT.slots[i], front = i < 5, max = s.hp * (1 + .05 * pav) * (front && R('c3a') ? 1.4 : 1);

function offlineSim(sec){

  const capSec = offlineCap(); sec = Math.min(sec, capSec); let drops = 0; rep.counted = sec;
  let t = 0; const chunk = 30;
  S.roster.forEach(a => { if (a.woundT) a.woundT = Math.max(0, a.woundT - sec); });
  while (t < sec) {
    const dt = Math.min(chunk, sec - t); econTick(dt); t += dt;
  }
  // battles: estimate clears at current stage
  let bt = 0, guard = 0;
  while (bt < sec && guard++ < 5000) {
    const N = S.stage, D = squadDps(N), req = reqDps(N);
    if (D <= 0) break;
    if (D < req) { if (S.stage > 1) { S.stage--; S.autoAdv = false; continue; } break; }
    const ct = Math.max(15, 10 + .8 * stageHp(N) / D); if (bt + ct > sec) break; bt += ct;
    S.res.silver += stageReward(N); spoils(N, isBoss(N) ? 4 : 1); rep.clears++; S.stats.clears++; bump('clears'); genStage(N).forEach(e => S.codex.kills[e.type] = (S.codex.kills[e.type] || 0) + 1);
    if (isBoss(N)) { S.codex.zones[Math.floor((N - 1) / 10)] = 1; if (drops < 25) { dropItem(N, N >= 50 ? 1 : 0); drops++; } } else if (drops < 25 && Math.random() < .03) { dropItem(N); drops++; } bump('kills', genStage(N).length); S.stats.kills += genStage(N).length;
    if (isBoss(N)) { S.res.medals += 1 + Math.floor(N / 20); if (!S.bossFirst[N]) { S.bossFirst[N] = 1; S.res.writs += 1 + Math.floor(N / 50); } }
    if (arrowsOn()) S.res.arrows = Math.max(0, S.res.arrows - lineUp().filter(Boolean).length * 12);
    if (S.autoAdv && squadDps(N + 1) >= reqDps(N + 1) * 1.1) { S.stage++; S.runMax = Math.max(S.runMax, S.stage); }
    else if (!S.autoAdv) { S.farmN++; if (S.farmN >= 10 && squadDps(N + 1) >= reqDps(N + 1) * 1.1) { S.autoAdv = true; S.farmN = 0; S.stage++; S.runMax = Math.max(S.runMax, S.stage); } }
  }
  S.bestEver = Math.max(S.bestEver, S.runMax); lgBest();
  rep.endStage = S.stage; return rep;
}

function expedReward(x){
  const E = EXPED[x.type], men = x.ids.map(id => S.roster.find(a => a.id === id)).filter(Boolean);
  const str = men.reduce((s, a) => s + a.lvl * a.stars, 0), m = (1 + str / 40) * Math.pow(1.07, Math.min(S.runMax, 200)) * E.t / 3600, out = {};
  if (x.type === 'forage') { out.food = 120 * m; out.wood = 100 * m; }
  if (x.type === 'fowl') { out.feathers = 120 * m; out.food = 60 * m; }
  if (x.type === 'raid') { out.silver = clearBonus(S.runMax) * 8 * m; out.iron = 60 * m; if (Math.random() < .35) out.writs = 1; if (Math.random() < .5) out.items = 1; }
  if (x.type === 'patrol') { out.medals = Math.round(3 + S.runMax / 15 + str / 30); out.writs = 1; out.iron = 50 * m; out.items = 2; }
  if (x.type === 'fowl' && Math.random() < .25) out.items = 1;
  return out;
}

/* ================= gacha ================= */
function weights(){ const t = B_('tavern'), d = L('dice'); return [50 - t * 1.5 - d, 30, 14 + t * .5, 5 + t * .6 + d * .6, 1 + t * .2 + d * .4]; }
function rollRar(){ S.pity++; if (S.pity >= 50) { S.pity = 0; return 4; } const w = weights(); let r = Math.random() * w.reduce((a, b) => a + b, 0); for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) { if (i === 4) S.pity = 0; return i; } } return 0; }
function pull(n){
  if (S.res.writs < n) return toast('Not enough writs.');
  const heroesOwned = () => S.roster.filter(a => a.hero).length;
  if (S.roster.length + n > rosterCap()) return toast('No room on the roll. Pay someone off or build up the Barracks or Tavern.');
  S.res.writs -= n; const out = [];
  for (let i = 0; i < n; i++) {
    let r = rollRar(); if (n === 10 && i === 9 && !out.some(o => o.a.rar >= 2) && r < 2) r = 2;
    let a, dupe = false;
    if (r === 4) { const keys = Object.keys(HEROES), un = keys.filter(k => !S.roster.some(x => x.hero === k)), k = Math.random() < .5 ? featuredHero() : un.length && Math.random() < .75 ? pick(un) : pick(keys), have = S.roster.find(x => x.hero === k);
      if (have) { if (have.stars < MAXSTARS) have.stars++; else S.res.medals += 30; a = have; dupe = true; } else a = newArcher(4, 'hero', k); }
    else a = newArcher(r, r === 0 ? 'levy' : r === 1 ? 'yeoman' : r === 2 ? (Math.random() < .55 ? 'welsh' : 'genoese') : 'veteran');
    if (!dupe) { a.gear = {}; a.kt = {}; S.roster.push(a); } out.push({a, dupe});
    S.codex.classes[a.cls === 'hero' ? 'hero_' + a.hero : a.cls] = 1; if (a.hero) { if (!S.codex.heroes[a.hero]) chron(`${a.name} joined the company.`); S.codex.heroes[a.hero] = 1; }
  }
  S.stats.recruits += n; bump('recruits', n); save(); render(); sfx('coin');
  gtag('event', 'recruit', {count:n, best:Math.max(...out.map(o => o.a.rar))});
  sheetFn = null;
  openSheet(`<div class="fell" style="font-size:26px;text-align:center">New recruits</div><div class="reveal">${out.map((o, i) => `<div class="cd r${o.a.rar}" data-i="${i}"><div class="in"><div class="bk">?</div><div class="fc" style="border-color:${RAR[o.a.rar].c}"><img class="pt" src="${portrait(o.a, 56)}" alt=""><small class="nm r${o.a.rar}">${esc(o.a.name)}</small><small class="sub">${o.dupe ? 'Rejoins: +1 star' : o.a.cls === 'hero' ? HEROES[o.a.hero].title : CLS[o.a.cls].n}</small></div></div></div>`).join('')}</div><button class="btn gold big" style="margin-top:14px" data-act="close">Welcome aboard</button>`);
  const cards = [...document.querySelectorAll('.cd')];
  cards.forEach(c => c.addEventListener('click', () => flip(c, out[+c.dataset.i].a.rar)));
  cards.forEach((c, i) => setTimeout(() => flip(c, out[i].a.rar), 400 + i * 230));
}
function flip(c, rar){ if (c.classList.contains('open')) return; c.classList.add('open'); sfx(rar >= 3 ? 'legend' : 'flip'); }

      ['Let him keep it', () => { A.lvl = Math.min(cap(A), A.lvl + 3); return `He buys a round. The lads like a captain who lets a man keep his winnings. ${esc(A.name)} gains 3 levels from sheer good cheer.`; }]]},

    {t:'The flux', x:'Dysentery is going through the camp like a rumour. The surgeon says boil the water. The priest says pray.', c:[
      ['Boil the water', () => { S.res.wood = Math.max(0, S.res.wood - storeCap('wood') * .3); return 'A third of your wood goes up in smoke. Nobody dies.'; }],

    {t:'A matter of honour', x:`${nm(A)} and ${nm(Bm)} have come to blows over a woman in the baggage train. She would like it noted she has no interest in either.`, c:[

    {t:'A travelling bowyer', x:'An old man with a cart of yew staves offers one, "the best I ever cut".', c:[
      [`Buy it for ${esc(A.name)} (${fmt(cb * 5)} silver)`, () => { if (S.res.silver < cb * 5) return 'You cannot afford it. He will be back, he says. He will not.'; S.res.silver -= cb * 5; if (!A.traits.includes('strong') && A.traits.length < 4) { A.traits.push('strong'); return `${esc(A.name)} gains Strong arm.`; } A.lvl = Math.min(cap(A), A.lvl + 5); return `${esc(A.name)} gains 5 levels.`; }],
      ['Send him on his way', () => 'He spits, and goes.']]},
    {t:'A stray dog', x:'A thin dog has attached itself to the company. The lads have named it Agincourt, which is optimistic.', c:[

    {t:'The friar', x:'A friar offers absolution for the whole company, at a price he insists is a discount.', c:[
      [`Pay the friar (${fmt(cb * 4)} silver)`, () => { if (S.res.silver < cb * 4) return 'Not enough. He blesses you anyway, grudgingly.'; S.res.silver -= cb * 4; S.roster.forEach(a => a.woundT = 0); return 'Shriven. Every wounded man is back on his feet. Nobody asks how.'; }],
      ['Decline', () => 'He mutters something in Latin that does not sound like a blessing.']]},
    {t:'A village with no one in it', x:'Doors open, fires still warm. The King has said looters hang. The lads have said they are hungry.', c:[
      ['Look the other way', () => { addRes('food', storeCap('food') * .5); S.res.silver += cb * 8; if (Math.random() < .25) { A.woundT = Math.max(A.woundT, 1200); return `Candlesticks, hams and silver. ${esc(A.name)} is caught by the provost and flogged. Out for twenty minutes.`; } return 'Candlesticks, hams and silver. Nobody saw. Probably.'; }],
      ['Forbid it', () => { S.res.medals += 3; return 'They grumble and march on hungry. Your captains approve. +3 medals.'; }]]},

  battleHud(true);

function checkUnlocks(){
