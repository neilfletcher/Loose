<style>
/*
VOICE: gritty campaign ledger, gallows humour, idle-game snap
IDEA: a captain's muster book in a soaked camp in 1415, numbers always going up
PICTURE: the top-down battlefield running on its own; portraits drawn from the same sprites
COLOUR and TYPE: deep field green, St George red, gilt for rarity; IM Fell for titles, Inter for the rest
LAYOUT: phone column, resource strip at the top, tabs at the bottom
*/
:root{--bg:#10140f;--p:#192117;--p2:#212b1e;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c;
--r0:#aeaca2;--r1:#72c35d;--r2:#55a2ea;--r3:#b874ea;--r4:#f2b233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#24301f 0%,var(--bg) 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.fell{font-family:"IM Fell English SC",Georgia,serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:8px 12px 6px;border-bottom:1px solid var(--line);background:#0d110c}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-family:"IM Fell English SC",serif;font-size:22px;line-height:1}
.logo b{color:var(--red)}
.rank{font-size:11px;color:var(--mut);flex:1}
.ib{width:32px;height:32px;border-radius:9px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.res{display:flex;gap:5px;overflow-x:auto;margin-top:7px;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.rc{flex:none;background:var(--p);border:1px solid var(--line);border-radius:9px;padding:3px 8px;font-size:12px;line-height:1.25;min-width:62px}
.rc b{display:block;font-size:13px;white-space:nowrap}
.rc span{color:var(--mut);font-size:10px;white-space:nowrap}
.rc.full b{color:#e9988c}
main{flex:1;overflow-y:auto;padding:4px 12px 20px;position:relative}
#battleView{position:absolute;inset:0;display:flex;flex-direction:column;padding:0}
nav{display:flex;border-top:1px solid var(--line);background:#0c100b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 0 8px;font-size:10.5px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav button.hide{display:none}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:9px;height:9px;border-radius:9px;background:var(--red);box-shadow:0 0 0 2px #0c100b}
h2{font-family:"IM Fell English SC",serif;font-weight:400;font-size:24px;margin:12px 0 2px}
h3{font-size:11px;letter-spacing:.12em;color:var(--mut);margin:16px 0 8px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px}
.sub b{color:var(--ink)}
.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{background:var(--p2);border:1px solid #3d4b38;border-radius:10px;padding:7px 11px;font-weight:700;white-space:nowrap;min-height:38px;font-size:13px;line-height:1.15}
.btn small{display:block;font-weight:600;font-size:10.5px;opacity:.85}
.btn.gold{background:linear-gradient(#f0c35c,#c08a26);color:#22170a;border-color:#f0c35c}
.btn.red{background:linear-gradient(#d4473b,#9a2a22);color:#fff;border-color:#d4473b}
.btn.ghost{color:#e9988c;border-color:#5a2a24}
.btn:disabled{opacity:.38;cursor:default}
.big{width:100%;padding:13px;font-size:16px}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);margin:3px 3px 0 0;color:var(--mut)}
.pill.g{color:#a8dd8e;border-color:#3e6a2e;background:#18240f}
.pill.b{color:#e9988c;border-color:#5a2a24;background:#24120f}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
.pt{width:50px;height:50px;border-radius:12px;flex:none;display:block}
.nm{font-weight:700}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.bar{height:5px;border-radius:4px;background:#2a3426;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}
.lock{opacity:.45}
.tag{font-size:10px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#2a3526;color:var(--mut)}
/* battle */
.bhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d110c;border-bottom:1px solid var(--line)}
.bhead .t{font-family:"IM Fell English SC",serif;font-size:19px;line-height:1.05}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:200px}
#cv{display:block;border-radius:4px}
#bMsg{position:absolute;top:28%;left:0;right:0;text-align:center;pointer-events:none;font-family:"IM Fell English SC",serif;font-size:28px;color:#fff3d6;text-shadow:0 3px 14px #000,0 0 2px #000;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.92)}
#bMsg.on{opacity:1;transform:scale(1)}
#bMsg small{display:block;font-family:Inter;font-size:13px;color:#e8dcc0}
.bfoot{background:#0d110c;border-top:1px solid var(--line);padding:8px 12px}
.prog{height:7px;border-radius:5px;background:#2a1a14;overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#c8372d,#e8b64c)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mut)}
.sw{width:38px;height:22px;border-radius:20px;background:#3a3022;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#cbbd9f;top:3px;left:3px;transition:.2s}
.sw.on{background:#a8741f}.sw.on:after{left:19px;background:#fff3d6}
.news{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,182,76,.35)}}
/* formation */
.form{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:12px;border:2px dashed #3d4b38;display:grid;place-items:center;position:relative;cursor:pointer;background:#141a12;overflow:hidden}
.slot img{width:100%;height:100%;display:block}
.slot.f{border-color:#6e3326}
.slot.x{opacity:.3;cursor:default}
.slot .lv{position:absolute;bottom:1px;right:3px;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .w{position:absolute;inset:0;background:rgba(80,10,5,.55);display:grid;place-items:center;font-size:10px;font-weight:800}
.slot.pick{border-style:solid;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pk{background:var(--p);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pk .pt{margin:0 auto 4px;width:58px;height:58px}
.pk small{display:block;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.off{opacity:.35;cursor:default}
.pk.sel{border-color:var(--gold);background:#2a2614}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
#modal.show{display:block}
#sheet{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;max-height:90%;overflow-y:auto;background:#151c13;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 16px 22px}
.handle{width:42px;height:4px;border-radius:4px;background:#3d4b38;margin:4px auto 10px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat4 div{background:#0f140e;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.stat4 b{display:block;font-size:15px}.stat4 span{font-size:9.5px;color:var(--mut);letter-spacing:.05em}
.bio{font-family:Georgia,serif;font-style:italic;color:#c7c0ad;font-size:14px;margin:8px 0}
.ev{font-family:Georgia,serif;font-size:15px;line-height:1.55;color:#ddd5c2}
.tav{border-radius:14px;padding:14px;background:linear-gradient(170deg,#3a2614,#1a120a);border:1px solid #5a3d1e;margin-top:8px}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.odds span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.3)}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.cd{perspective:600px;height:132px}
.cd .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.cd.open .in{transform:rotateY(180deg)}
.cd .fc,.cd .bk{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.cd .bk{background:repeating-linear-gradient(45deg,#3a2614 0 6px,#2c1c0e 6px 12px);border:2px solid #6a4a24;font-family:"IM Fell English SC",serif;font-size:28px;color:#8a6a3a}
.cd .fc{transform:rotateY(180deg);background:#151c13;border:2px solid}
.cd .fc .pt{width:56px;height:56px;margin-bottom:4px}
.cd .fc small{font-size:11px;line-height:1.2}
.cd.r4 .fc{box-shadow:0 0 22px rgba(242,178,51,.6)}
.cd.r3 .fc{box-shadow:0 0 14px rgba(184,116,234,.45)}
.bico{width:44px;height:44px;border-radius:12px;background:#0f140e;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:20px}
.cost{font-size:11px;color:var(--mut)}
.cost .no{color:#e9988c}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.days div{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;font-size:10px;color:var(--mut)}
.days div.got{background:#2a2614;border-color:var(--gold);color:var(--gold)}
.days div.now{border-color:var(--red);color:var(--ink)}
.perk .lvl{font-weight:800;color:var(--gold)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#2a1712;border:1px solid #6e3326;color:#f3c3b5;padding:9px 16px;border-radius:10px;font-size:13px;z-index:80;display:none;max-width:90%;text-align:center}
#toast.ok{background:#18240f;border-color:#3e6a2e;color:#cfe8b8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow"><div class="logo">Loose<b>!</b></div><div class="rank" id="rank"></div><button class="ib" id="snd" aria-label="Sound">🔊</button><button class="ib" id="setBtn" aria-label="Settings">⚙️</button></div>
    <div class="res" id="res"></div>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="battle"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M14 4h6v6M4 20l3-1M4 20l1-3"/></svg>Battle</button>

    <button data-tab="legacy"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9.9 5.5L12 15.6 7.1 18.2l.9-5.5-4-3.9 5.5-.8z"/></svg>Legacy</button>
  </nav>
</div>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
{
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞'; if (n < 0) return '-' + fmt(-n);
  if (n < 10) return (Math.round(n * 10) / 10).toString(); if (n < 1000) return Math.floor(n).toString();
  const e = Math.floor(Math.log10(n) / 3); if (e >= SUF.length) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, e); return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + SUF[e];
}
function fmtT(s){ s = Math.max(0, Math.round(s)); if (s < 60) return s + 's'; if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's'; return Math.floor(s / 3600) + 'h ' + Math.floor(s % 3600 / 60) + 'm'; }

/* ================= data ================= */
const RAR = [{n:'Common',c:'#aeaca2',st:1},{n:'Uncommon',c:'#72c35d',st:1},{n:'Rare',c:'#55a2ea',st:2},{n:'Epic',c:'#b874ea',st:3},{n:'Legendary',c:'#f2b233',st:4}];

const TRAITS = {

  tough:{n:'Tough as boots', d:'Health +30%', g:1}, steady:{n:'Steady', d:'Damage +8%, rarely misses', g:1}, pious:{n:'Pious', d:'Slowly heals during a fight', g:1},

  xbow:   {n:'Crossbowman', hp:1.2, arm:.1, spd:18, dps:0, ranged:1.5, range:125, cd:2.8, aggro:0, brk:6, pay:1.4, r:8.5},

  boss:   {n:'Captain', hp:40, arm:.45, spd:12, dps:5, aggro:45, brk:45, pay:30, r:13, boss:1}
};
const ZONES = [
  {n:'Southampton Muster', mix:{levy:6, spear:2}, g:['#5f7d3c','#4d6a30'], th:'Rabble', boss:'The Quartermaster\'s Enforcer'},
  {n:'The Sally Ports of Harfleur', mix:{levy:4, spear:3, xbow:2}, g:['#617a3c','#4f672f'], th:'Mixed', boss:'Captain of the Garrison'},
  {n:'The Somme Fords', mix:{spear:3, xbow:2, maa:1}, g:['#5b7d44','#486836'], th:'Mixed', boss:'Warden of the Ford'},

  {n:'The Field of Agincourt', mix:{maa:4, knight:3, xbow:1}, g:['#5a5a34','#4a4628'], th:'Cavalry', mud:.7, boss:"The Duc d'Alençon"},

  const dmg = b.dmg * lvMul(a.lvl) * sm * (t.includes('strong') ? 1.15 : 1) * (t.includes('steady') ? 1.08 : 1) * (t.includes('drunk') ? .9 : 1) * dmgMult() * (1 + (g.bow ? g.bow.v : 0) / 100) * (1 + (g.head ? g.head.v / 2 : 0) / 100) * (a.nick ? 1.05 : 1);

}

function bCost(k){ const b = BLD[k], l = B_(k), o = {}; for (const r in b.cost) o[r] = b.cost[r] * Math.pow(b.g, l); if (k === 'tavern') {} return o; }

}

function resMult(r){ return r === 'food' && R('l1') ? 1.5 : r === 'iron' && R('l2') ? 1.5 : r === 'feathers' && R('l4') ? 2 : 1; }
const supMult = () => R('c5') ? 1.6 : 1;
function rankMult(i){ return (i < 5 ? 1.2 : 1) * (i >= 5 && R('a3a') ? 1.3 : 1) * (R('c3b') ? 1.1 : 1); }
function offlineCap(){ return (4 * 3600 + 2 * 3600 * L('ledger') + (R('l3b') ? 7200 : 0)) * (G('away') ? 2 : 1); }

/* ---------- gear ---------- */
function gearOf(a){ const o = {}; if (!a.gear) return o; for (const s in a.gear) { const it = S.gear.find(i => i.id === a.gear[s]); if (it) o[s] = it; } return o; }
const gearOwner = id => S.roster.find(a => a.gear && Object.values(a.gear).includes(id));
const itemName = it => GSLOT[it.s].names[it.r];
function itemStat(it){ return it.s === 'bow' ? `+${it.v}% damage` : it.s === 'head' ? `+${Math.round(it.v / 2)}% damage, +${Math.round((.04 + .03 * it.r) * 100)}% pierce` : it.s === 'armour' ? `+${it.v}% health` : `+${Math.round(it.v / 2)}% loose rate`; }
function rollItemRar(min){ const w = [45, 30, 16, 7, 2]; let r = Math.random() * 100; for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) return Math.max(min || 0, i); } return Math.max(min || 0, 0); }
function makeItem(r, il, s){ s = s || pick(Object.keys(GSLOT)); return {id:uid(), s, r, il, v:Math.max(1, Math.round((4 + 4 * r) * (1 + il / 15) * rnd(.85, 1.15)))}; }
function salvageVal(it){ const m = Math.pow(1.07, Math.min(it.il, 150)); return {iron:15 * (it.r + 1) * m, feathers:10 * (it.r + 1) * m, medals:it.r >= 3 ? it.r - 1 : 0}; }
function dropItem(il, min){
  const it = makeItem(rollItemRar(min), il);
  if (S.gear.length >= 80) { const v = salvageVal(it); for (const k in v) addRes(k, v[k]); return null; }
  S.gear.push(it); if (it.r >= 4) chron(`Found ${itemName(it)} at stage ${il}.`);
  return it;
}
function gearHtml(a){
  const g = gearOf(a);
  return `<h3>GEAR</h3><div class="grid" style="grid-template-columns:repeat(2,1fr)">${Object.keys(GSLOT).map(s => { const it = g[s]; return `<div class="pk" data-act="gearslot" data-id="${a.id}" data-s="${s}" style="text-align:left;padding:8px">${it ? `<small class="r${it.r}"><b>${itemName(it)}</b></small><small class="sub">${itemStat(it)}</small>` : `<small><b>${GSLOT[s].n}</b></small><small class="sub">Empty. Tap to equip.</small>`}</div>`; }).join('')}</div>`;
}
function sheetGear(aid, s){
  sheetFn = () => sheetGear(aid, s);
  const a = S.roster.find(x => x.id === aid), cur = a && a.gear[s], items = S.gear.filter(i => i.s === s).sort((p, q) => q.v - p.v);

  <div style="margin-top:10px">${cur ? `<button class="btn big" data-act="unequip" data-id="${aid}" data-s="${s}">Take it off</button>` : ''}
  ${items.length ? items.map(it => { const o = gearOwner(it.id); return `<div class="card row" data-act="equip" data-id="${aid}" data-i="${it.id}" style="cursor:pointer;${it.id === cur ? 'border-color:var(--gold)' : ''}"><div class="grow"><b class="r${it.r}">${itemName(it)}</b> <span class="sub">from stage ${it.il}</span><div class="sub">${itemStat(it)}${o && o !== a ? ` · used by ${esc(o.name.split(' ')[0])}` : it.id === cur ? ' · equipped' : ''}</div></div></div>`; }).join('') : '<div class="sub" style="margin-top:8px">No gear for this slot yet.</div>'}</div>`);
}
function sheetArmoury(){

  openSheet(`<div class="fell" style="font-size:24px">The Armoury</div><div class="sub">${S.gear.length}/80 pieces. When it is full, new drops are broken down automatically. Breaking gear down gives iron and feathers, and medals for Epic and Legendary pieces.</div>

  <div style="margin-top:10px">${items.map(it => { const o = gearOwner(it.id); return `<div class="card row"><div class="grow"><b class="r${it.r}">${itemName(it)}</b> <span class="sub">${GSLOT[it.s].n} · stage ${it.il}</span><div class="sub">${itemStat(it)}${o ? ` · ${esc(o.name.split(' ')[0])}` : ''}</div></div>${o ? '' : `<button class="btn" data-act="salvage" data-i="${it.id}">Break down</button>`}</div>`; }).join('') || '<div class="sub">Empty. Beat a boss.</div>'}</div>`);
}

/* ---------- bonds and nicknames ---------- */
const bondKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
function adjacentSlots(i){ const out = [], col = i % 5, row = i < 5 ? 0 : 1; if (col > 0) out.push(i - 1); if (col < 4) out.push(i + 1); out.push(row ? i - 5 : i + 5); return out; }
function bondMult(i, ln){ let m = 1; adjacentSlots(i).forEach(j => { const a = ln[i], b = ln[j]; if (!a || !b) return; const bd = S.bonds[bondKey(a.id, b.id)]; if (bd && bd.st === 'f') m += .06; if (bd && bd.st === 'g') m -= .06; }); return m; }
function growBonds(units){
  const bySlot = {}; units.forEach(u => bySlot[u.i] = u.a);
  units.forEach(u => adjacentSlots(u.i).forEach(j => { const b = bySlot[j]; if (!b || b.id < u.a.id) return; const k = bondKey(u.a.id, b.id), bd = S.bonds[k] || (S.bonds[k] = {p:0}); bd.p++;
    if (!bd.st && bd.p >= 20) { bd.st = Math.random() < .82 ? 'f' : 'g'; chron(bd.st === 'f' ? `${u.a.name} and ${b.name} have stood side by side long enough to be friends.` : `${u.a.name} and ${b.name} cannot stand each other. It shows in their shooting.`); } }));
}
function bondHtml(a){
  const fr = [], gr = []; for (const k in S.bonds) { const bd = S.bonds[k]; if (!bd.st) continue; const ids = k.split('|'); if (!ids.includes(a.id)) continue; const o = S.roster.find(x => x.id === (ids[0] === a.id ? ids[1] : ids[0])); if (!o) continue; (bd.st === 'f' ? fr : gr).push(esc(o.name.split(' ')[0])); }
  if (!fr.length && !gr.length) return '<div class="sub" style="margin-top:8px">No firm friends yet. Men who stand next to each other long enough become friends (+6% damage when side by side), or occasionally enemies.</div>';
  return `<div class="sub" style="margin-top:8px">${fr.length ? `Friends with <b>${fr.join(', ')}</b>. ` : ''}${gr.length ? `Cannot stand <b style="color:#e9988c">${gr.join(', ')}</b>.` : ''}</div>`;
}
function checkNick(a){
  if (a.nick) return; const tot = Object.values(a.kt).reduce((s, v) => s + v, 0);
  for (const n of NICKS) { const v = n.t === 'all' ? tot : a.kt[n.t] || 0; if (v >= n.n) { a.nick = n.k; chron(`${a.name} is known now as "${n.k}".`); if (BT) BT.fx.push({t:0, x:BT.units.find(u => u.a === a)?.x || W / 2, y:H / 2, txt:`${a.name.split(' ')[0]} "${n.k}"`, col:'#f2d07a', big:1}); return; } }
}
function killArcher(a, how){
  S.fallen.push({name:dispName(a), rar:a.rar, lvl:a.lvl, kills:a.kills, how, ep:pick(EPITAPH)});
  if (S.fallen.length > 60) S.fallen.shift();
  chron(`${dispName(a)} fell. ${how}`);
  S.roster = S.roster.filter(m => m !== a); S.form = S.form.map(f => f === a.id ? null : f);
}

/* ---------- research ---------- */
function rUnlocked(n){
  if (R(n.id)) return false;
  if (n.x && RESEARCH.some(o => o.x === n.x && R(o.id))) return false;
  if (n.t === 1) return true;
  return RESEARCH.some(o => o.br === n.br && o.t === n.t - 1 && R(o.id));
}
const rSlots = () => R('l5') ? 2 : 1;
const rTime = n => RTIME[n.t - 1] * (G('scholar') ? .5 : 1);
function viewStudy(){
  let h = `<h2>The Scriptorium</h2><div class="sub">Monks, clerks and one very old knight write down what the company has learned. Research is permanent: it survives every new campaign. One subject at a time${rSlots() > 1 ? ' (two with Scribes)' : ''}. Some choices rule out others.</div>
  <div class="card" style="margin-top:10px">📖 <b>${fmt(S.res.parchment)}</b> parchment <span class="sub">· +${fmt(rate('scriptorium'))}/s from the Scriptorium${B_('scriptorium') ? '' : ' (build it in Camp)'}</span></div>`;
  S.research.active.forEach(x => { const n = RESEARCH.find(r => r.id === x.id), left = (x.end - Date.now()) / 1000; h += `<div class="card"><b>Studying: ${n.n}</b><div class="bar"><i style="width:${clamp(100 * (1 - left / rTime(n)), 0, 100)}%"></i></div><div class="sub">${fmtT(left)} left</div></div>`; });
  ['Archery', 'Logistics', 'Command'].forEach(br => {
    h += `<h3>${br.toUpperCase()}</h3>`;
    RESEARCH.filter(n => n.br === br).forEach(n => {
      const done = R(n.id), act = S.research.active.some(x => x.id === n.id), lockedOut = n.x && !done && RESEARCH.some(o => o.x === n.x && R(o.id)), can = rUnlocked(n) && !act, c = RCOST[n.t - 1];
      h += `<div class="card row ${!done && !can && !act ? 'lock' : ''}"><div class="grow"><b>${done ? '✓ ' : ''}${n.n}</b> <span class="sub">tier ${n.t}${n.x ? ' · choose one' : ''}</span><div class="sub">${n.d}${lockedOut ? ' · ruled out by your choice' : ''}</div>${!done && !lockedOut ? `<div class="cost">📖${fmt(c)} · ${fmtT(rTime(n))}</div>` : ''}</div>${can ? `<button class="btn ${S.res.parchment >= c && S.research.active.length < rSlots() ? 'gold' : ''}" data-act="research" data-id="${n.id}" ${S.res.parchment >= c && S.research.active.length < rSlots() ? '' : 'disabled'}>Study</button>` : act ? '<span class="sub">Studying</span>' : ''}</div>`;
    });
  });
  return h;
}

  Object.keys(GARTER).forEach(k => { const P = GARTER[k], l = G(k), mx = P.max && l >= P.max, c = Math.ceil(P.c * Math.pow(P.g, l)); h += `<div class="card row"><div class="grow"><b>${P.n}</b> <span class="lvl" style="color:var(--gold);font-weight:800">${l ? 'Lv ' + l : ''}</span><div class="sub">${P.d}</div></div>${mx ? '<span class="sub">Held</span>' : `<button class="btn ${S.res.garter >= c ? 'gold' : ''}" data-act="gperk" data-id="${k}" ${S.res.garter >= c ? '' : 'disabled'}>🎗️ ${c}</button>`}</div>`; });

/* ---------- ticking extras ---------- */
let notifiedFull = false, lastDailyNote = '';
function extraTick(dt){
  const now = Date.now();
  S.research.active = S.research.active.filter(x => { if (x.end > now) return true; S.research.done[x.id] = 1; const n = RESEARCH.find(r => r.id === x.id); chron(`The clerks have finished: ${n.n}.`); toast(`Research complete: ${n.n}`, true); notify('Research complete', n.n); gtag('event', 'research', {id:x.id}); refreshLineStats(); return false; });
  S.exped.forEach(x => { if (!x.noted && x.end <= now) { x.noted = 1; notify('Expedition back', `${EXPED[x.type].n}: your men are back in camp.`); } });
  const full = S.res.food >= storeCap('food') - 1 && S.res.wood >= storeCap('wood') - 1;
  if (full && !notifiedFull) { notifiedFull = true; notify('Storehouse full', 'Food and wood are at the cap. Spend them or build up the Storehouse.'); } else if (!full) notifiedFull = false;
  if (dailyReady() && lastDailyNote !== dayKey()) { lastDailyNote = dayKey(); notify('Daily rations', 'Your daily rations are ready to collect.'); }
  if (G('auto')) { S._autoT = (S._autoT || 0) + dt; if (S._autoT > 5) { S._autoT = 0; S.roster.forEach(a => { if (a.lvl >= cap(a) && a.stars < MAXSTARS && canPay(promoteCost(a))) { pay(promoteCost(a)); a.stars++; } }); } }
}

/* ---------- cloud save ---------- */
let fbAuth = null, fbDb = null, fbUser = null, cloudState = 'off', cloudMsg = '', cloudChoice = null;
function initCloud(){
  if (!window.firebase || !firebase.initializeApp) { cloudState = 'unavailable'; return; }
  try { if (!firebase.apps.length) firebase.initializeApp(FB); fbAuth = firebase.auth(); fbDb = firebase.firestore(); cloudState = 'ready';
    fbAuth.onAuthStateChanged(u => { fbUser = u; if (u) onSignedIn(); refreshSheet(); }); } catch(e) { cloudState = 'unavailable'; }
}
function signIn(){ if (!fbAuth) return; fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => { cloudMsg = e.code === 'auth/popup-blocked' ? 'Your browser blocked the sign-in window. Allow pop-ups and try again.' : 'Sign-in did not work: ' + (e.message || e.code); refreshSheet(); }); }
async function onSignedIn(){
  gtag('event', 'login'); cloudMsg = 'Checking your cloud save...'; refreshSheet();
  try {
    const doc = await fbDb.collection('loose_saves').doc(fbUser.uid).get();
    if (!doc.exists) { await cloudUpload(); cloudMsg = 'Saved to the cloud.'; refreshSheet(); return; }
    const d = doc.data();
    if (d.updated > (S.cloudAt || 0) + 60000 && d.data !== JSON.stringify(S)) { cloudChoice = d; sheetCloudChoice(); return; }
    await cloudUpload(); cloudMsg = 'Saved to the cloud.';
  } catch(e) { cloudMsg = e.code === 'permission-denied' ? 'Signed in, but the cloud database is not open yet. Your game is still saved on this device.' : 'Could not reach the cloud: ' + (e.message || e.code); }
  refreshSheet();
}
async function cloudUpload(){
  if (!fbUser || !fbDb) return; S.cloudAt = Date.now(); save();
  await fbDb.collection('loose_saves').doc(fbUser.uid).set({data:JSON.stringify(S), updated:S.cloudAt, best:S.bestEver, stage:S.stage, prestiges:S.prestiges, v:VERSION});
}
function sheetCloudChoice(){
  const d = cloudChoice; sheetFn = null;
  openSheet(`<div class="fell" style="font-size:24px">Two saves found</div><p class="ev">Your account has a save from ${new Date(d.updated).toLocaleString('en-GB')}. This device has a different one. Which do you want to keep? The other is replaced.</p>
  <div class="card"><b>Cloud save</b><div class="sub">Best stage ${d.best} · ${d.prestiges} campaigns ended</div><button class="btn gold big" style="margin-top:8px" data-act="usecloud">Use the cloud save</button></div>
  <div class="card"><b>This device</b><div class="sub">Best stage ${S.bestEver} · ${S.prestiges} campaigns ended</div><button class="btn big" style="margin-top:8px" data-act="keeplocal">Keep this device's save</button></div>`);
}

function offlineSim(sec){

  S.roster.forEach(a => { if (a.woundT) a.woundT = Math.max(0, a.woundT - sec); });
  while (t < sec) {
    const dt = Math.min(chunk, sec - t); econTick(dt); t += dt;
  }
  // battles: estimate clears at current stage
  let bt = 0, guard = 0;
  while (bt < sec && guard++ < 5000) {
    const N = S.stage, D = squadDps(N), req = reqDps(N);
    if (D <= 0) break;
    if (D < req) { if (S.stage > 1) { S.stage--; S.autoAdv = false; continue; } break; }
    const ct = Math.max(15, 10 + .8 * stageHp(N) / D); if (bt + ct > sec) break; bt += ct;
    S.res.silver += stageReward(N); spoils(N, isBoss(N) ? 4 : 1); rep.clears++; S.stats.clears++; bump('clears'); genStage(N).forEach(e => S.codex.kills[e.type] = (S.codex.kills[e.type] || 0) + 1);
    if (isBoss(N)) { S.codex.zones[Math.floor((N - 1) / 10)] = 1; if (drops < 25) { dropItem(N, N >= 50 ? 1 : 0); drops++; } } else if (drops < 25 && Math.random() < .03) { dropItem(N); drops++; } bump('kills', genStage(N).length); S.stats.kills += genStage(N).length;
    if (isBoss(N)) { S.res.medals += 1 + Math.floor(N / 20); if (!S.bossFirst[N]) { S.bossFirst[N] = 1; S.res.writs += 1 + Math.floor(N / 50); } }
    if (arrowsOn()) S.res.arrows = Math.max(0, S.res.arrows - lineUp().filter(Boolean).length * 12);
    if (S.autoAdv && squadDps(N + 1) >= reqDps(N + 1) * 1.1) { S.stage++; S.runMax = Math.max(S.runMax, S.stage); }
    else if (!S.autoAdv) { S.farmN++; if (S.farmN >= 10 && squadDps(N + 1) >= reqDps(N + 1) * 1.1) { S.autoAdv = true; S.farmN = 0; S.stage++; S.runMax = Math.max(S.runMax, S.stage); } }
  }
  S.bestEver = Math.max(S.bestEver, S.runMax);

}

function expedReward(x){

  if (!S.seen.orders && S.bestEver >= 7) { S.seen.orders = 1; msgs.push('Orders from the King, and daily rations.'); }

let lastReal = performance.now(), uiT = 0, saveT = 0;
