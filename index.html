<style>
/*
VOICE: gritty campaign ledger, gallows humour, idle-game snap
IDEA: a captain's muster book in a soaked camp in 1415, numbers always going up
PICTURE: the top-down battlefield running on its own; portraits drawn from the same sprites
COLOUR and TYPE: deep field green, St George red, gilt for rarity; IM Fell for titles, Alegreya Sans for the rest
LAYOUT: phone column, resource strip at the top, tabs at the bottom
*/
:root{--bg:#10140f;--p:#192117;--p2:#212b1e;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c;
--r0:#aeaca2;--r1:#72c35d;--r2:#55a2ea;--r3:#b874ea;--r4:#f2b233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 "Alegreya Sans",system-ui,sans-serif;overflow:hidden}
body{background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.fell{font-family:"IM Fell English SC",Georgia,serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#side{display:none}
body.wide #app{max-width:1440px;display:grid;grid-template-columns:minmax(380px,.8fr) minmax(440px,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"hd hd" "side main" "side tut" "side nav"}
body.wide header{grid-area:hd}body.wide #side{display:block;grid-area:side;position:relative;min-height:0;border-right:1px solid var(--line)}
body.wide main{grid-area:main;min-height:0}body.wide #tut{grid-area:tut}body.wide nav{grid-area:nav}body.wide nav button[data-tab=battle]{display:none}
body.wide.ff #app{grid-template-columns:1fr 0;max-width:none}body.wide.ff main,body.wide.ff #tut{display:none}
header{padding:8px 12px 6px;border-bottom:1px solid var(--line);background:#0d110c}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-family:"IM Fell English SC",serif;font-size:22px;line-height:1}
.logo b{color:var(--red)}
.rank{font-size:12.5px;color:var(--mut);flex:1}
.ib{width:32px;height:32px;border-radius:2px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-size:15.5px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;margin-top:7px}
.rc{background:var(--p);border:1px solid var(--line);border-radius:2px;padding:3px 6px 4px;line-height:1.2;overflow:hidden}
.rc b{display:block;font-size:14px;white-space:nowrap;letter-spacing:-.01em}
.rc span{display:block;color:var(--mut);font-size:11px;white-space:nowrap}
.rc i{display:block;height:3px;border-radius:2px;background:#2a3426;margin-top:3px;overflow:hidden}
.rc i s{display:block;height:100%;background:#7fae5a;text-decoration:none}
.rc.full b{color:#e9988c}.rc.full i s{background:#e0503e}
@media (min-width:480px){.res{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.rc b{font-size:14.5px}}
main{flex:1;overflow-y:auto;padding:4px 12px 20px;position:relative}
#battleView{position:absolute;inset:0;display:flex;flex-direction:column;padding:0}
#cardBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:70;display:none;align-items:center;gap:8px;background:#2b2410;border:1px solid var(--gold);padding:7px 8px 7px 12px;width:min(92vw,520px);font-size:14.5px;color:#f3e6c0}#cardBar.on{display:flex}#cardBar b{color:var(--gold);letter-spacing:.08em;font-size:12px}#cardBar .btn{padding:6px 10px}
nav{display:flex;border-top:1px solid var(--line);background:#0c100b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 0 8px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav button.hide{display:none}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:9px;height:9px;border-radius:2px;background:var(--red);box-shadow:0 0 0 2px #0c100b}
h2{font-family:"IM Fell English SC",serif;font-weight:400;font-size:24px;margin:12px 0 2px}
h3{font-family:"IM Fell English SC",Georgia,serif;font-size:16px;font-weight:400;color:#c9b88f;margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.sub{color:var(--mut);font-size:14px}
.sub b{color:var(--ink)}
.card{background:var(--p);border:1px solid var(--line);border-radius:2px;padding:11px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{background:var(--p2);border:1px solid #3d4b38;border-radius:2px;padding:7px 11px;font-weight:700;white-space:nowrap;min-height:38px;font-size:14.5px;line-height:1.15}
.btn small{display:block;font-weight:600;font-size:12px;opacity:.85}
.btn.gold{background:#d29f3b;color:#1d1408;border-color:#a77a24}
.btn.red{background:#b3342a;color:#fff;border-color:#86251d}
.btn.ghost{color:#e9988c;border-color:#5a2a24}
.btn:disabled{opacity:.38;cursor:default}
.big{width:100%;padding:13px;font-size:16px}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;border:1px solid var(--line);margin:3px 3px 0 0;color:var(--mut)}
.pill.g{color:#a8dd8e;border-color:#3e6a2e;background:#18240f}
.pill.b{color:#e9988c;border-color:#5a2a24;background:#24120f}
.stars{color:var(--gold);font-size:12.5px;letter-spacing:-1px}
.pt{width:50px;height:50px;border-radius:2px;flex:none;display:block}
.nm{font-weight:700}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.bar{height:5px;border-radius:2px;background:#2a3426;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold)}
.lock{opacity:.45}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:1px 6px;border-radius:2px;background:#2a3526;color:var(--mut)}
/* battle */
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px;background:#0d110c;border-bottom:1px solid var(--line)}
.bhead .t{font-family:"IM Fell English SC",serif;font-size:19px;line-height:1.05}
.bhead .grow{min-width:0;flex:1 0 96px}.bhead .bbtns{display:flex;gap:8px;margin-left:auto;justify-content:flex-end}@media (max-width:400px){.bhead .bbtns{gap:5px}.bhead .bbtns .btn{padding-left:7px;padding-right:7px}}.bhead .t,.bhead #bS{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bhead .btn{padding-left:10px;padding-right:10px;flex:none}
body.ff header,body.ff #nav,body.ff #tut,body.ff .bfoot .row:last-child{display:none!important}body.ff .bhead{padding:4px 10px}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:200px}
#cv{display:block;border-radius:2px}
#bMsg{position:absolute;top:28%;left:0;right:0;text-align:center;pointer-events:none;font-family:"IM Fell English SC",serif;font-size:28px;color:#fff3d6;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .3s,transform .3s;transform:scale(.92)}
#bMsg.on{opacity:1;transform:scale(1)}
#bMsg small{display:block;font-family:"Alegreya Sans";font-size:14.5px;color:#e8dcc0}
.bfoot{background:#0d110c;border-top:1px solid var(--line);padding:8px 12px}
.lstrip{display:flex;gap:3px;margin-bottom:6px;height:34px}.lchip{flex:1 1 0;min-width:0;background:#141a12;border:1px solid #2e3a2a;color:#d8ccb0;padding:2px 3px;font:600 11px/1.2 'Alegreya Sans',sans-serif;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.lchip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.lchip i{display:block;height:5px;background:#3e6a2e}.lchip.low i{background:#c8a22a}.lchip.crit i{background:var(--red)}.lchip.down{opacity:.55}.lchip.down b{color:#ff9a8a}.lstrip.pick .lchip{border-color:#8fe08a;box-shadow:inset 0 0 0 1px #8fe08a}
.bfoot .row>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bfoot .tog{white-space:nowrap}
.prog{height:7px;border-radius:2px;background:#2a1a14;overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:var(--red)}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--mut)}
.sw{width:18px;height:18px;border:2px solid #7a6640;background:transparent;position:relative;flex:none}
.sw:after{content:"";position:absolute;display:none;left:4px;top:0;width:5px;height:10px;border:solid #1d1408;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sw.on{background:var(--gold);border-color:var(--gold)}.sw.on:after{display:block}
.news{outline:2px solid var(--gold);outline-offset:-2px}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,182,76,.35)}}
/* formation */
.form{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:2px;border:2px dashed #3d4b38;display:grid;place-items:center;position:relative;cursor:pointer;background:#141a12;overflow:hidden}
.slot img{width:100%;height:100%;display:block}
.slot.f{border-color:#6e3326}
.slot.x{opacity:.3;cursor:default}
.slot .lv{position:absolute;bottom:1px;right:3px;font-size:11.5px;font-weight:800;text-shadow:0 1px 2px #000}
.slot .w{position:absolute;inset:0;background:rgba(80,10,5,.55);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.slot.pick{border-style:solid;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pk{background:var(--p);border:2px solid var(--line);border-radius:2px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pk .pt{margin:0 auto 4px;width:58px;height:58px}
.pk small{display:block;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.off{opacity:.35;cursor:default}
.pk.sel{border-color:var(--gold);background:#2a2614}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
#modal.show{display:block}
#sheet{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;max-height:90%;overflow-y:auto;background:#151c13;border:1px solid var(--line);border-radius:4px 4px 0 0;padding:8px 16px 22px}
.sheetx{position:sticky;top:0;float:right;margin:-6px -4px 0 0;width:36px;height:36px;border:1px solid #3d4b38;background:#1a2016;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;z-index:2}.sheetx:hover{border-color:var(--gold)}
.rankbtn{display:inline-flex;align-items:center;gap:7px;margin-left:10px;padding:4px 10px 4px 8px;border:1px solid #6b5a2a;background:#221f12;color:var(--ink);font:inherit;font-size:13px;line-height:1.1;cursor:pointer;text-align:left;position:relative;max-width:46vw}.rankbtn small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.rankbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rankbtn b{color:var(--gold);font-size:18px}.rankbtn:hover{border-color:var(--gold)}.rankbtn.dot::after{content:'';position:absolute;top:-4px;right:-4px;width:9px;height:9px;background:#d8584c}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.08);box-shadow:0 0 0 5px rgba(232,182,76,.45)}100%{transform:scale(1);box-shadow:none}}.pop{animation:pop .35s ease-out}
@keyframes flash{0%{background:rgba(232,182,76,.22)}100%{background:transparent}}.card.flash{animation:flash .6s ease-out}
.btn:active{transform:scale(.94)}
.village{display:block;width:100%;max-width:760px;height:auto;margin:0 auto;border:1px solid var(--line);touch-action:manipulation}
.handle{width:42px;height:4px;border-radius:2px;background:#3d4b38;margin:4px auto 10px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat4 div{background:#0f140e;border:1px solid var(--line);border-radius:2px;padding:6px;text-align:center}
.stat4 b{display:block;font-size:16.5px}.stat4 span{font-size:11px;color:var(--mut);letter-spacing:.05em}
.bio{font-family:Georgia,serif;font-style:italic;color:#c7c0ad;font-size:15.5px;margin:8px 0}
.ev{font-family:Georgia,serif;font-size:16.5px;line-height:1.55;color:#ddd5c2}
.tav{border-radius:2px;padding:14px;background:#2a1d10;border:1px solid #5a3d1e;margin-top:8px}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.odds span{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:2px;background:rgba(0,0,0,.3)}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.cd{perspective:600px;height:132px}
.cd .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.cd.open .in{transform:rotateY(180deg)}
.cd .fc,.cd .bk{position:absolute;inset:0;border-radius:2px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.cd .bk{background:repeating-linear-gradient(45deg,#3a2614 0 6px,#2c1c0e 6px 12px);border:2px solid #6a4a24;font-family:"IM Fell English SC",serif;font-size:28px;color:#8a6a3a}
.cd .fc{transform:rotateY(180deg);background:#151c13;border:2px solid}
.cd .fc .pt{width:56px;height:56px;margin-bottom:4px}
.cd .fc small{font-size:12.5px;line-height:1.2}
.cd.r4 .fc{border-width:3px}
.cd.r3 .fc{border-width:3px}
.bico{width:44px;height:44px;border-radius:2px;background:#0f140e;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:20px}
.cost{font-size:12.5px;color:var(--mut)}
.cost .no{color:#e9988c}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.days div{border:1px solid var(--line);border-radius:2px;padding:5px 2px;text-align:center;font-size:11.5px;color:var(--mut)}
.days div.got{background:#2a2614;border-color:var(--gold);color:var(--gold)}
.days div.now{border-color:var(--red);color:var(--ink)}
.perk .lvl{font-weight:800;color:var(--gold)}
#updBar{position:fixed;left:0;right:0;top:0;z-index:85;background:#2b2410;border-bottom:2px solid var(--gold);color:#f3e6c0;padding:10px 14px;display:none;align-items:center;gap:10px;font-size:15px}#updBar.on{display:flex}
#adTest{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.9);display:grid;place-items:center;text-align:center;padding:20px}#adTest>div{max-width:340px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#2a1712;border:1px solid #6e3326;color:#f3c3b5;padding:9px 16px;border-radius:2px;font-size:14.5px;z-index:80;display:none;max-width:90%;text-align:center}
#toast.ok{background:#18240f;border-color:#3e6a2e;color:#cfe8b8}
#tut{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#2a2614;border-top:1px solid #6a5424;font-size:14.5px;line-height:1.35}
#tut b{color:var(--gold)}
nav button.tutp{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold);border-radius:2px}
.nmin{width:100%;padding:7px 9px;border-radius:2px;background:#0f140e;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;font-weight:700}
.sw2{display:inline-block;width:30px;height:30px;border-radius:2px;border:2px solid var(--line);cursor:pointer;margin:2px}
.sw2.on{border-color:var(--gold);outline:2px solid var(--gold);outline-offset:1px}
.gearrow{display:flex;gap:5px;margin-top:6px;align-items:center}
.gc{width:34px;height:34px;border-radius:2px;display:grid;place-items:center;font-size:16px;background:#0f140e;border:2px solid var(--line);cursor:pointer;position:relative}
.gc.e{border-style:dashed;border-color:#6e3326;opacity:.8}
.gc.e.can{border-color:var(--gold);opacity:1}
.gc.e:after{content:"+";position:absolute;font-size:14.5px;font-weight:800;color:#e9988c}
.gc.e.can:after{color:var(--gold)}
.gc span{filter:saturate(1.2)}
.eqrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #22301f}
.eqrow:last-child{border-bottom:0}
.eqrow .gc{touch-action:none}.gc.dragsrc{opacity:.35}.gc.droptgt{outline:2px solid var(--gold);outline-offset:1px}#gdrag{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-60%) scale(1.25)}
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib .ic{width:18px;height:18px;vertical-align:0}
.btn.gold .ic,.btn.red .ic,.days div.got .ic{color:inherit!important}
.bico .ic{width:24px;height:24px}
.gc .ic{width:18px;height:18px}
.eqrow img{width:34px;height:34px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="updBar" role="status"><span class="grow">A new version of Loose! is ready.</span><button class="btn gold" data-act="updopen">See what's new</button><button class="btn" data-act="upddismiss" aria-label="Later">Later</button></div>
<div id="app">
  <header>
    <div class="hrow"><div class="logo">Loose<b>!</b></div><button class="rankbtn" id="rank" data-act="captain" title="Your captain: rank, reputation, orders and raids"></button><div style="flex:1"></div><button class="btn gold" id="updBtn" style="display:none;min-height:34px;padding:4px 10px">Update</button><button class="ib" id="snd" aria-label="Sound"></button><button class="ib" id="setBtn" aria-label="Settings"></button></div>
    <div class="res" id="res"></div>
  </header>
  <div id="side"></div>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="battle"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M14 4h6v6M4 20l3-1M4 20l1-3"/></svg>Battle</button>
    <button data-tab="camp"><svg viewBox="0 0 24 24"><path d="M2 20L12 4l10 16zM12 4v16M9 20l3-5 3 5"/></svg>Camp</button>
    <button data-tab="company"><svg viewBox="0 0 24 24"><path d="M7 3c9 4 9 14 0 18M7 3v18M4 12h16"/></svg>Company</button>

/* bosses and special stages already stand well above the stage before them, so before 25 they take only a little of the early bump */

/* ---------- 2.28: anonymous daily head count. One add per game opened, split new/returning and by site.
   No ID, no cookie, nothing stored or read on the device for it, so it runs without the stats consent.
   The live site and the itch.io copy count; other portal copies (CrazyGames) send nothing. ---------- */
function headCount(isNew){
  if (PORTAL && PORTAL !== 'itch') return;
  try {
    const src = PORTAL === 'itch' ? 'itch' : 'web', day = new Date().toISOString().slice(0, 10), base = `projects/${FB.projectId}/databases/(default)/documents`;
    const f = [{fieldPath:'opens_' + src, increment:{integerValue:'1'}}]; if (isNew) f.push({fieldPath:'new_' + src, increment:{integerValue:'1'}});
    fetch(`https://firestore.googleapis.com/v1/${base}:commit?key=${FB.apiKey}`, {method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true,
      body:JSON.stringify({writes:[{transform:{document:`${base}/loose_counts/${day}`, fieldTransforms:f}}]})}).catch(() => {});
  } catch(e){}
}

/* ---------- privacy switches (2.29). Play stats are on unless the player turns them off in Settings: they only go to
   our own database, to see how the game is played, which UK law (PECR as amended by the Data (Use and Access) Act 2025)
   allows without consent so long as players are told and can opt out. Google Analytics is a third party, so it stays
   off unless the player turns it on. 'loose-consent' = 'no' means stats off; 'loose-ga' = 'yes' means Analytics on.
   The itch.io copy sends play stats too; other portal copies send nothing. ---------- */
const consentV = () => { try { return localStorage.getItem('loose-consent') || ''; } catch(e) { return ''; } };

const statsOn = () => (!PORTAL || PORTAL === 'itch') && consentV() !== 'no';

let mus = null;
function musicStart(){
  if (!AC || mus || !S.music || !S.sound || document.hidden) return;
  const a = AC, g = a.createGain(); g.gain.value = .045; g.connect(a.destination);
  mus = {g, next:a.currentTime + .4, step:0, note:4};
}

function bossBar(t){
  const st = mus.step % 16; bassNote(t, 73.42 * Math.pow(2, BOSS_BASS[st] / 12), .5);

const morFloor = () => fol('priest') ? 25 : 0;
function morMove(n){ if (S.mor === undefined) S.mor = morBase(); S.mor = clamp(S.mor + n, morFloor(), 100); }
const MORW = [[80, 'In fine heart', 1.10], [65, 'Cheerful', 1.05], [35, 'Steady', 1], [20, 'Grumbling', .93], [0, 'Mutinous', .85]];
function morState(){ const m = S.mor === undefined ? morBase() : S.mor; const w = MORW.find(x => m >= x[0]); return {m, n:w[1], dmg:morOn() ? w[2] : 1}; }
function morTick(dt){ if (S.mor === undefined) S.mor = morBase(); const b = morBase(), step = dt / 240; S.mor = S.mor < b ? Math.min(b, S.mor + step) : Math.max(b, S.mor - step); if (S.mor < morFloor()) S.mor = morFloor(); }
/* hangovers are per archer; teetotallers never get them */
const hungover = a => a.hang && a.hang > Date.now() && !a.traits.includes('sober');
function hangover(a, min){ if (a.traits.includes('sober')) return false; a.hang = Math.max(a.hang || 0, Date.now() + min * 60e3); tr('hangover'); return true; }
function setBond(a, b, st){ S.bonds[bondKey(a.id, b.id)] = {p:20, st}; tr('bond_' + st); }
function leaveCompany(a, why){ chron(`${dispName(a)} ${why}`); S.roster = S.roster.filter(m => m !== a); S.form = S.form.map(f => f === a.id ? null : f); }
function joinCompany(a, why){ S.roster.push(a); S.codex.classes[a.cls] = 1; S.stats.recruits = (S.stats.recruits || 0) + 1; chron(`${a.name} ${why}`); }
function campHtml(){
  if (!morOn()) return '';
  const ms = morState(), b = morBase(), pct = ms.m, col = pct >= 65 ? '#8fbf6a' : pct >= 35 ? 'var(--gold)' : '#e9988c';
  const hung = S.roster.filter(hungover);
  let h = `<h3>CAMP LIFE</h3><div class="card"><div class="row"><b class="grow">Morale: ${ms.n}</b><span class="sub">${Math.round(pct)} of 100</span></div><div class="prog" style="margin-top:6px"><i style="width:${pct}%;background:${col}"></i></div>
  <div class="sub" style="margin-top:6px">${ms.dmg > 1 ? `<b>+${Math.round((ms.dmg - 1) * 100)}% damage</b> while spirits are up.` : ms.dmg < 1 ? `<b style="color:#e9988c">${Math.round((ms.dmg - 1) * 100)}% damage</b> until spirits lift.` : 'No effect on the fighting either way.'} Victories, ale, pay and kindness raise it; deaths, defeats, the whip and cold nights lower it. It drifts back towards ${b} on its own.</div>
  ${hung.length ? `<div class="sub" style="margin-top:6px">Hungover (−20% damage): ${hung.map(a => `<b>${esc(a.name.split(' ')[0])}</b> ${Math.ceil((a.hang - Date.now()) / 60e3)}m`).join(', ')}</div>` : ''}</div>`;
  const have = Object.keys(FOLLOW).filter(fol);
  h += `<div class="sub" style="margin:10px 0 6px">CAMP FOLLOWERS · ${have.length} OF ${Object.keys(FOLLOW).length}. Cooks, laundresses, sutlers and the rest of the baggage train. They join through camp news.</div>`;
  h += have.length ? `<div class="card">${have.map(k => `<div style="padding:3px 0"><b>${FOLLOW[k].n}</b> <span class="sub">${FOLLOW[k].r}. ${FOLLOW[k].d}</span></div>`).join('')}</div>` : '<div class="card sub">Nobody yet. Keep an eye on the camp news.</div>';
  return h;
}

/* ---------- the new camp events ---------- */
function campLife(A, Bm, nm, cb){
  const fn = a => esc(a.name.split(' ')[0]), P = PR(A), Q = PR(Bm);
  const room = S.roster.length < rosterCap(), common = S.roster.filter(a => !a.away && !a.hero && !a.friend && a.rar <= 2 && !S.form.includes(a.id));
  const drunk = S.roster.find(a => !a.away && a.traits.includes('drunk')), woman = S.roster.find(a => !a.away && isF(a) && a !== A);
  const line = () => lineUp().filter(Boolean), lvl = (a, n) => { a.lvl = Math.min(cap(a), a.lvl + n); };
  const addTrait = (a, t) => { if (a.traits.includes(t) || a.traits.length >= 4) return false; a.traits.push(t); return true; };
  const pay = n => { if (S.res.silver < n) return false; S.res.silver -= n; return true; };
  const cost = n => `${fmt(n)} silver`;
  const E = [];
  const add = (o) => { o.own = 1; E.push(o); };
  add({id:'alewife', ok:() => !fol('alewife'), t:'The alewife', x:'A broad woman called Pernel has set up a tent and three barrels just behind the lines. The men have found it already.', c:[
    ['Let her stay', () => { addFol('alewife'); morMove(8); repMove(0, 4); line().slice(0, 2).forEach(a => hangover(a, 30)); return 'Pernel joins the baggage train. Morale is up, and two of the line are already the worse for wear.'; }],
    ['Move her on', () => { morMove(-6); repMove(2, -3); return 'She packs up, slowly, so everyone can see who sent her away.'; }]]});
  add({id:'match', t:'A drinking match', x:`${nm(A)} has challenged ${nm(Bm)} to a drinking match. Half the camp has a bet on it.`, c:[
    ['Let them drink', () => { morMove(7); hangover(A, 45); hangover(Bm, 45); const w = Math.random() < .5 ? A : Bm; if (!w.nick) { w.nick = 'Hollow-Legs'; tr('nick'); } chron(`${w.name} won a drinking match, and the name Hollow-Legs with it.`); return `${fn(w)} is still standing at dawn and is known as Hollow-Legs from now on. Both of them are hungover for most of the morning.`; }],
    ['Not tonight', () => { morMove(-3); return 'The bets are called off. Nobody is pleased, and the quartermaster least of all.'; }]]});
  if (drunk) add({id:'pledge', t:'Taking the pledge', x:`${nm(drunk)} has woken in a ditch for the third time this week and swears before the priest never to touch a drop again.`, c:[
    ['Hold them to it', () => { drunk.traits = drunk.traits.filter(t => t !== 'drunk'); addTrait(drunk, 'sober'); repMove(4, -2); morMove(-2); chron(`${drunk.name} took the pledge, and kept it.`); return `It is a hard week. ${esc(drunk.name.split(' ')[0])} shakes, sweats and swears, then comes out of it steadier than ever. Loses Drunkard, gains Teetotal.`; }],
    ['Pour them a drink', () => { repMove(-2, 5); morMove(3); return 'The pledge lasts until supper. Everyone is relieved, including the priest.'; }]]});
  add({id:'sore', ok:() => morState().m >= 55, t:'Sore heads', x:'Last night got out of hand. Half the line is green, and someone has been sick in the Bowyer\'s workshop.', c:[
    ['Into the river with them', () => { repMove(-2, -6); morMove(-6); line().forEach(a => a.hang = 0); return 'Scott marches them down to the river and holds them under, one by one. They come up cursing and sober.'; }],
    ['Let them sleep it off', () => { morMove(3); line().filter((_, i) => i % 2 === 0).forEach(a => hangover(a, 30)); return 'You give them the morning. They will shoot badly until noon, and like you for it.'; }]]});
  if (room) add({id:'muster', t:'A woman at the muster', x:'A woman in a borrowed jack turns up at the butts and outshoots half your company before anyone thinks to ask her name. It is Wenna, a forester\'s daughter from Dean.', c:[
    ['Sign her on', () => { const a = newArcher(2, 'yeoman', null, true); a.name = 'Wenna of Dean'; a.bio = "A forester's daughter from the Forest of Dean. Outshot half the company at her first muster, then asked when supper was."; addTrait(a, 'keen'); joinCompany(a, 'signed on at the butts.'); repMove(5, 3); return 'Wenna of Dean joins the company as a Rare yeoman, Keen-eyed. Several of the men demand a rematch. They lose that too.'; }],
    ['Send her home', () => { repMove(-4, 0); return 'She shrugs and walks off towards the French lines. You hope she is going home.'; }]]});
  add({id:'laund', ok:() => !fol('laund'), t:'The washerwomen', x:'Mother Hobbs and her daughters do the washing for the knights. She says your archers smell like a tannery, and offers to take them on too.', c:[
    [`Take her on (${cost(cb * 3)})`, () => { if (!pay(cb * 3)) return 'You cannot afford her. She sniffs, which in the circumstances is brave.'; addFol('laund'); morMove(4); return 'Clean shirts all round. The fevers ease off, and wounds heal faster.'; }],
    ['They smell fine', () => 'They do not.']]});
  add({id:'sutler', ok:() => !fol('sutler'), t:'The sutler', x:'Jankin the sutler follows armies the way crows do. He has a cart of boots, salt, needles and dice, and very reasonable prices for a man with a monopoly.', c:[
    ['Let him trade', () => { addFol('sutler'); morMove(3); repMove(-1, 2); return 'Jankin joins the baggage train. He takes a cut of everything, and somehow you make more.'; }],
    ['Drive him off', () => { morMove(-2); repMove(3, -1); return 'He goes, promising to be back. He will be.'; }]]});
  add({id:'herb', ok:() => !fol('herb') && medicOn(), t:'The herbwife', x:'Old Nan from the Fens has a bag of moss, willow bark and things she will not name. Doc says she is a witch. Doc also wants to know where she gets the moss.', c:[
    ['Take her on', () => { addFol('herb'); repMove(2, 3); return 'Nan and Doc argue about everything and work together perfectly. Doc has one more bandage every battle.'; }],
    ['Doc knows best', () => 'Doc is quietly disappointed. He wanted the moss.']]});
  add({id:'cook', ok:() => !fol('cook'), t:'A proper cook', x:'Hamo cooked for a bishop until the bishop died. He swears it was not the food, and offers to feed the company.', c:[
    [`Hire him (${cost(cb * 5)})`, () => { if (!pay(cb * 5)) return 'You cannot run to it. Hamo goes to cook for the Burgundians, who do not deserve him.'; addFol('cook'); morMove(10); return 'The first stew is so good that two men cry. Morale settles higher from now on, and training costs less food.'; }],
    ['Pottage will do', () => { morMove(-2); return 'Pottage it is. Again.'; }]]});
  add({id:'boy', ok:() => !fol('boy') && B_('fletcher') > 0, t:'The fletcher\'s boy', x:'A camp follower\'s lad, Little Tib, has been sorting feathers for the Fletcher for nothing. He wants to be paid, and to be an archer one day.', c:[
    ['Take him on', () => { addFol('boy'); morMove(3); return 'Tib gets a penny a day and a promise. The Fletcher turns out 15% more arrows.'; }],
    ['Send him back to his mother', () => 'His mother is not pleased to see him either.']]});
  add({id:'priest', ok:() => !fol('priest'), t:'A chaplain', x:'Father Anselm has walked from Calais to minister to the company. He has no money, no shoes and no doubts at all.', c:[
    ['Make him chaplain', () => { addFol('priest'); morMove(5); repMove(4, 2); return 'He hears confessions until midnight and takes a lot of notes. Morale will never fall below 25 while he is here.'; }],
    ['We have God already', () => { repMove(-2, 0); return 'He blesses you anyway, which somehow feels worse.'; }]]});
  const wed = a => Object.keys(S.bonds).some(k => S.bonds[k].st === 'w' && k.split('|').includes(a.id));
  const W = pick(S.roster.filter(a => !a.away && isF(a) && !wed(a))) || null, M = W ? pick(S.roster.filter(a => !a.away && !isF(a) && !wed(a) && !S.bonds[bondKey(a.id, W.id)]?.st)) : null;
  if (W && M) add({id:'wed', t:'Sweethearts', x:`${nm(W)} and ${nm(M)} have been seen walking out together by the river, and now they want to be married. The priest will do it for a fee.`, c:[
    [`Pay the priest (${cost(cb * 2)})`, () => { if (!pay(cb * 2)) return 'You cannot afford the priest. They jump the broom instead, which is cheaper and nearly as legal.'; setBond(W, M, 'w'); morMove(12); repMove(3, 6); chron(`${W.name} and ${M.name} were married in camp.`); return `The whole company turns out for it. ${fn(W)} and ${fn(M)} are married: +10% damage each when they stand side by side.`; }],
    ['Not in my company', () => { morMove(-5); repMove(-2, -4); if (S.bonds[bondKey(W.id, M.id)]) delete S.bonds[bondKey(W.id, M.id)]; return 'They go back to their own tents, and do not speak to you for a week.'; }]]});
  if (A !== Bm) add({id:'theft', t:'Missing arrows', x:`${nm(A)} swears ${nm(Bm)} has been stealing ${P.his} arrows. ${nm(Bm)} swears ${Q.he} has not, while holding a suspicious number of arrows.`, c:[
    ['Make them shake hands', () => { if (Math.random() < .6) { setBond(A, Bm, 'f'); morMove(2); return `It takes an hour and a jug of ale, but they shake on it and mean it. They are friends now: +6% damage side by side.`; } setBond(A, Bm, 'g'); return 'They shake hands and both count their fingers afterwards. They will not stand each other now.'; }],
    [`Flog ${fn(Bm)}`, () => { Bm.woundT = Math.max(Bm.woundT, 600); setBond(A, Bm, 'g'); repMove(3, -6); morMove(-3); return `Ten strokes. ${fn(Bm)} is out for ten minutes, and the two of them are enemies for life.`; }]]});
  if (A !== Bm) add({id:'ditch', t:'Out of the ditch', x:`In the last fight ${nm(A)} dragged ${nm(Bm)} out of a ditch with a Frenchman still attached.`, c:[
    ['Stand them both a drink', () => { setBond(A, Bm, 'f'); morMove(4); hangover(A, 20); hangover(Bm, 20); return `They drink to each other until the barrel is dry. Friends for life now: +6% damage side by side.`; }],
    ['Mention it in dispatches', () => { lvl(A, 5); capXP(4); repMove(3, 0); return `Your letter to the Constable names ${fn(A)}. ${P.He} gains 5 levels, and walks taller for it.`; }]]});
  if (common.length) { const D = pick(common); add({id:'desert', t:'One of ours', x:`${nm(D)} tried to slip away in the night with a sack of the company's bread, and was caught at the pickets.`, c:[
    ['Hang them', () => { leaveCompany(D, 'was hanged for desertion.'); repMove(6, -12); morMove(-8); tr('hanged'); return `The provost does it at dawn, in front of the whole company. Nobody tries it again. Nobody looks at you quite the same way, either.`; }, 'Fair, Feared'],
    ['Flog them', () => { D.woundT = Math.max(D.woundT, 1800); repMove(2, -4); morMove(-2); return `Twenty strokes. ${esc(D.name.split(' ')[0])} is out for half an hour, and will think twice.`; }, 'Feared'],
    ['Forgive them', () => { lvl(D, 3); addTrait(D, 'steady'); repMove(-4, 8); morMove(4); chron(`${D.name} deserted, was forgiven, and stayed.`); return `You give back the bread and ask why. It is a long story, and a sad one. ${esc(D.name.split(' ')[0])} stays, and fights like someone with a debt to pay.`; }, 'Loved']]}); }
  if (A !== Bm) add({id:'debt', t:'Gambling debts', x:`${nm(A)} owes ${nm(Bm)} a month's pay at dice and cannot pay it. ${nm(Bm)} wants it out of ${P.his} hide.`, c:[
    [`Pay the debt (${cost(cb * 4)})`, () => { if (!pay(cb * 4)) return 'You cannot cover it either. You confiscate the dice instead, which pleases nobody.'; repMove(2, 6); morMove(3); return `${fn(A)} swears never to gamble again. ${fn(Bm)} buys a round with the money, which is a sort of justice.`; }],
    ['Let them sort it out', () => { addTrait(A, 'nervous'); addTrait(Bm, 'greedy'); setBond(A, Bm, 'g'); return `${fn(Bm)} takes it out of ${fn(A)}'s pay for the rest of the campaign. ${fn(A)} turns Nervous, ${fn(Bm)} turns Greedy, and they hate each other.`; }]]});
  add({id:'ballad', t:'A ballad', x:`Riles has written a ballad about ${nm(A)}. It has nineteen verses and rhymes "Agincourt" with "had a snort".`, c:[
    ['Let him sing it', () => { morMove(6); if (!A.nick) { A.nick = pick(['the Ballad', 'Nineteen Verses', 'the Bold']); tr('nick'); chron(`Riles sang a ballad about ${A.name}, known since as "${A.nick}".`); return `The men sing it for a week. ${fn(A)} is known as "${A.nick}" from now on, and ${P.his} damage is 5% better for the fame.`; } lvl(A, 3); return `The men sing it for a week. ${fn(A)} pretends to hate it and gains 3 levels.`; }],
    ['Burn it', () => { morMove(-2); return 'Riles says the Chronicle will remember this. It will.'; }]]});
  add({id:'prisoner', t:'A wounded Frenchman', x:'A French squire lies wounded in your lines. His family is rich. Doc says he could live, with care.', c:[
    ['Ransom him', () => { S.res.silver += cb * 12; repMove(-3, 0); return `His family pays ${fmt(cb * 12)} silver and complains about the price in three letters.`; }],
    ['Doc patches him up and he goes free', () => { repMove(8, 3); capXP(5); morMove(2); return 'He limps off towards his own lines, waving. Word of it gets round both armies. Fair dealing is remembered.'; }]]});
  add({id:'cold', t:'Cold nights', x:'The wind has turned and the nights are bitter. The men are sleeping in their boots and still shivering.', c:[
    [`Buy cloaks (${cost(cb * 4)})`, () => { if (!pay(cb * 4)) { morMove(-6); return 'You cannot afford cloaks. The men shiver and blame you.'; } morMove(10); repMove(4, 4); return 'Thick Flemish wool for every man in the line. Spirits rise with the temperature.'; }],
    ['They will toughen up', () => { morMove(-8); repMove(-2, -3); const v = pick(S.roster.filter(a => !a.away)); if (v) { v.woundT = Math.max(v.woundT, 900); return `They do not toughen up. ${esc(v.name.split(' ')[0])} goes down with a chill, out for fifteen minutes.`; } return 'They do not toughen up.'; }]]});
  add({id:'lice', t:'Lice', x:'The whole company is scratching. The surgeon recommends shaving every head in camp, including yours.', c:[
    ['Shave them all', () => { morMove(-4); repMove(3, -2); return 'Scott does it with a knife and no mercy. The company looks like a monastery and sleeps through the night.'; }],
    ['Live with it', () => { S.buffs = S.buffs || []; S.buffs.push({k:'dmg', m:.95, end:Date.now() + 3600e3, n:'Itching'}); morMove(-2); return 'Nobody can hold a bow still for scratching. -5% damage for an hour.'; }]]});
  add({id:'ghost', t:'A ghost on the picket', x:`${nm(A)} swears ${P.he} saw a pale knight walking the picket line at midnight, with no head and very poor manners.`, c:[
    ['Laugh it off', () => { addTrait(A, 'nervous'); morMove(-2); return `Everyone laughs. ${fn(A)} does not, and turns Nervous.`; }],
    [`Post a priest (${cost(cb * 2)})`, () => { if (!pay(cb * 2)) return 'No silver for the priest. The ghost stays.'; addTrait(A, 'pious'); morMove(3); return `The priest sits up all night with a candle. No ghost. ${fn(A)} turns Pious, which helps on a bad day.`; }]]});
  add({id:'contest', t:'A shooting contest', x:'The men want a contest at the butts, with a prize for the best shot in the company.', c:[
    [`Put up a prize (${cost(cb * 3)})`, () => { if (!pay(cb * 3)) return 'You cannot afford a prize. They shoot for pride, which is cheaper.'; const w = pick(line().length ? line() : [A]); morMove(8); if (!addTrait(w, 'keen')) lvl(w, 5); chron(`${w.name} won the shooting contest.`); return `${esc(w.name)} wins by a feather and takes the purse. ${w.traits.includes('keen') ? 'Keen-eyed now, and insufferable.' : '5 levels, and insufferable.'}`; }],
    ['No time for games', () => { morMove(-3); return 'They shoot for nothing, badly, and grumble.'; }]]});
  add({id:'letter', t:'A letter from home', x:`${nm(A)} has a letter from home. The harvest failed and the family are eating the seed corn.`, c:[
    [`Send money home (${cost(cb * 3)})`, () => { if (!pay(cb * 3)) return 'You cannot spare it. You write a kind letter instead.'; lvl(A, 4); repMove(4, 6); morMove(3); return `The money goes with the next ship. ${fn(A)} fights like someone with a family to feed: +4 levels.`; }],
    ['Nothing to be done', () => { addTrait(A, 'nervous'); morMove(-2); return `${fn(A)} goes quiet and stays quiet. Nervous now.`; }]]});
  if (room) add({id:'outlaw', t:'The outlaw', x:'Will of the Wold, outlaw, poacher and alleged sheep thief, walks into camp and offers his bow in return for a pardon.', c:[
    ['Sign him on', () => { const a = newArcher(3, 'veteran', null, false); a.name = 'Will of the Wold'; a.bio = 'Outlaw, poacher and alleged sheep thief. The sheep has never been found.'; addTrait(a, 'brawler'); joinCompany(a, 'came in from the woods for a pardon.'); repMove(-5, 3); return 'Will joins as an Epic veteran, a Brawler. The sheriff of York writes you a very cross letter.'; }],
    ['Hand him over', () => { S.res.medals += 4; repMove(6, -3); return 'The sheriff pays a bounty in medals. Will looks at you like he will remember your face.'; }]]});
  add({id:'stories', t:'Old soldiers', x:`${nm(A)} has the camp round the fire telling of Crécy, where ${P.his} grandfather stood. It is going on very late.`, c:[
    ['Let them talk', () => { morMove(8); const y = [...S.roster].filter(a => !a.away).sort((p, q) => p.lvl - q.lvl)[0]; if (y) lvl(y, 3); line().slice(0, 3).forEach(a => hangover(a, 15)); return `Nobody sleeps much. The youngest, ${y ? esc(y.name.split(' ')[0]) : 'a levy'}, learns more in a night than in a month: +3 levels.`; }],
    ['Lights out', () => { morMove(-2); repMove(2, -2); return 'The fire is put out. Somewhere in the dark the story carries on in whispers.'; }]]});
  add({id:'feast', t:"Saint Crispin's feast", x:"It is a saint's day and the men want a feast. There is an ox going spare, if nobody asks where it came from.", c:[
    ['Roast the ox', () => { S.res.food = Math.max(0, S.res.food - storeCap('food') * .25); morMove(15); repMove(-1, 6); line().forEach(a => hangover(a, 20)); return 'The whole company eats until it hurts and drinks until it stops hurting. Morale soars. Everyone in the line is hungover in the morning.'; }],
    ['Hear mass, then march', () => { const p = pick(S.roster.filter(a => !a.away)); if (p) addTrait(p, 'pious'); repMove(5, -2); morMove(-1); return `A sober day. ${p ? esc(p.name.split(' ')[0]) + ' finds religion and turns Pious.' : ''}`; }]]});
  if (woman) add({id:'knight', t:'Not in the line', x:`A knight of the household rides up and says ${nm(woman)} has no business standing in a line of archers, being a woman.`, c:[
    ['Back her', () => { lvl(woman, 5); repMove(6, 4); morMove(4); return `You point out that ${esc(woman.name.split(' ')[0])} has killed more Frenchmen this month than he has. He rides off. She gains 5 levels from the satisfaction.`; }],
    ['Keep the peace', () => { addTrait(woman, 'nervous'); repMove(-6, -3); morMove(-4); return `You move her to the back rank for the afternoon. She does not forget it. Nervous now.`; }]]});
  /* 2.21: choices that clearly push you towards Feared or Loved */
  add({id:'poach', t:'The poacher', x:"A village boy has been caught taking the company's deer. His mother is at the pickets, weeping.", c:[
    ['Hang him as a warning', () => { repMove(2, -10); morMove(-2); return 'The village learns to leave your deer alone. Your men learn something about you too.'; }, 'Feared'],
    ['Feed him and send him home', () => { repMove(-1, 9); morMove(3); return 'He goes home with a haunch of venison. The village brings you eggs for a week.'; }, 'Loved']]});
  add({id:'sentry', t:'Asleep on watch', x:`${nm(A)} was found asleep on the picket line with ${P.his} bow for a pillow.`, c:[
    ['Make an example', () => { A.woundT = Math.max(A.woundT, 900); repMove(3, -9); S.buffs = S.buffs || []; S.buffs.push({k:'dmg', m:1.05, end:Date.now() + 1800e3, n:'Wide awake'}); return `Twenty strokes in front of the company. Nobody so much as yawns: +5% damage for half an hour. ${fn(A)} is out for fifteen minutes.`; }, 'Feared'],
    ['Let it pass', () => { repMove(-2, 8); morMove(3); return `You wake ${P.him} with your boot and say nothing more. ${fn(A)} will not forget it.`; }, 'Loved']]});
  add({id:'mock', t:'Insolence', x:`${nm(A)} has been doing an impression of you round the fire. It is, everyone agrees, very good.`, c:[
    ['The stocks, for a day', () => { addTrait(A, 'nervous'); repMove(0, -10); return `${fn(A)} spends a day in the stocks. The impression is not performed again, at least not where you can hear it.`; }, 'Feared'],
    ['Ask for an encore', () => { lvl(A, 2); repMove(0, 9); morMove(5); return `You laugh louder than anyone. ${fn(A)} gains 2 levels and a lot of goodwill.`; }, 'Loved']]});
  add({id:'nameday', t:'Your name day', x:"The men have found out it is your name day. They have clubbed together for a gift: a very large, very ugly hat.", c:[
    [`Wear it and stand a round (${cost(cb * 2)})`, () => { if (!pay(cb * 2)) { repMove(0, 4); return 'You cannot afford the round, but you wear the hat. It is enough.'; } repMove(0, 9); morMove(10); line().forEach(a => hangover(a, 15)); return 'You wear the hat all evening. The men will be talking about it for years.'; }, 'Loved'],

function newCards(){

  NEWC.forEach(c => { if (!S.cards[c.id] && c.on() && !(S.cardQ || []).includes(c.id)) { (S.cardQ = S.cardQ || []).push(c.id); if (c.id === 'news') S.newsT = Math.min(S.newsT || 30, 30); } });

}
/* New cards wait in a small banner above the bottom bar instead of taking over the screen; at most one a minute */

  const tutor = S.tut >= 1 && S.tut < 99, q = (S.cardQ || []).filter(id => !S.cards[id]);
  if (!q.length || tutor) { bar.classList.remove('on'); return; }

  const gained = ['silver','food','wood','iron','feathers','arrows','writs','medals'].map(r => [r, S.res[r] - (rep.res0[r] || 0)]).filter(([, v]) => v > .5);
  sheetFn = null; lastAway = gained.filter(([r]) => AD_DOUBLE.includes(r));
  const dbl = lastAway.length && adOk('offline') ? `<button class="btn big" data-act="adoffline" style="margin-bottom:8px">Double the silver and materials${adSmall('offline')}</button>` : '';
  openSheet(`<div class="fell" style="font-size:26px">While you were away</div><p class="ev">The company kept at it for ${fmtT(rep.counted)}${rep.counted < rep.sec ? ` (the most your ledger covers; you were gone ${fmtT(rep.sec)})` : ''}. ${rep.clears ? `They cleared ${fmt(rep.clears)} stage${rep.clears > 1 ? 's' : ''} and now hold stage ${rep.endStage}.` : 'No battles were won.'}${rep.medals ? ` Farming old ground earned ${rep.medals} medal${rep.medals > 1 ? 's' : ''}.` : ''}</p>
  <div class="card">${gained.map(([r, v]) => `<div class="row" style="padding:2px 0"><span class="grow">${RES[r].i} ${RES[r].n}</span><b>+${fmt(v)}</b></div>`).join('') || '<div class="sub">Nothing much.</div>'}</div>${dbl}<button class="btn gold big" data-act="welcomeok">Back to it</button>`);
}

/* ================= boot ================= */
const existed = load();
headCount(!existed);
if (PORTAL === 'itch') { S.tr = S.tr || {}; S.tr.src_itch = 1; }
if (!S.seen) S.seen = {};
migrate();
checkUnlocks();
if (existed) { const away = (Date.now() - S.last) / 1000; if (away > 30) { const rep = offlineSim(away); welcome(rep); } }
newBattle(); render(); save();
if (!existed) { sheetFn = null; openSheet(`<div class="fell" style="font-size:28px">Loose!</div><p class="ev">August 1415. You have three archers, a farm, a woodpile and a King who expects results.</p><p class="ev">Your company fights on its own, stage after stage, even while you are away. You can lend a hand in a fight with volleys, and later with Doc, pitch barrels and fire arrows, but your real job is everything else: who stands in the line and where (arranged on the Formation screen), how well they are trained and equipped, what you build and study, who you recruit, and when to take the company home for glory.</p><p class="ev" style="font-size:14.5px">Sign in from Settings to keep your game safe and play on any device.</p><button class="btn gold big" data-act="close">To the field</button>`); }
requestAnimationFrame(rafLoop);
window.__dbg = {featuredHero, bulkKeep, lvlCost, rosterCap, slotsOpen, chron, taleClose, taleInit, blowBarrel, useFire, get FIRE(){ return FIRE; }, dlyRoll, get dly(){ return S.dly; }, dProg, bDur, checkUnlocks, ORDERS, giveOrder, farmMedal, promoteCost, offlineSim, portrait, faceOf, campLife, morState, morMove, addFol, hungover, hangover, get EV(){ return EV; }, campEvent, viewCompany, get BTs(){ return BT; }, friendRecruit, killArcher, startBuild, buildTick, setUpd(i){ updInfo = i; updBtnShow(); }, get V(){ return V; }, HEROES, newArcher, levelUp, bCost, canPay, pay, lineUp, autofill, pull, bUnlocked, isMax, RESEARCH, RCOST, rUnlocked, rTime, rSlots, cap, BLD, evAfter, evState, tutTick, weekNo, dropItem, extraTick, doGarter, get S(){ return S; }, get BT(){ return BT; }, squadDps, reqDps, stageHp, prestige, gloryGain, frame, newBattle, render};
}
</script>
<script id="relnotes" type="application/json">[
{"v":"2.29","items":["Anonymous play stats are now on unless you turn them off, in Settings under Privacy. They show how far people get and what they use, never who you are.","Google Analytics has its own switch in Settings and stays off unless you turn it on."]},
{"v":"2.28","items":["The game now adds one to an anonymous daily count each time it's opened, so the developer can see how many people are playing. No ID, no cookies and nothing about you. Details in the privacy notice."]},
{"v":"2.27.2","items":["Long-pressing on a phone no longer selects text or pops up the magnifier."]},
{"v":"2.27.1","items":["If you've enjoyed Loose!, you can now buy the developer a pint on Ko-fi, from Settings. Supporters get two extra banners for the company. Entirely optional, and the game stays free."]},
{"v":"2.27","items":["The game now asks before it sends any anonymous play stats or uses Google Analytics. Change your mind any time in Settings, under Privacy.","There's a privacy notice, linked from Settings, saying what is kept and where.","Groundwork for releasing Loose! on other game sites."]},
{"v":"2.26.25","items":["Legendaries and friends can no longer die, in battle or on patrol. If one is knocked down, they are wounded and recover like anyone else.","Any Legendary who died before this update comes back to the company exactly as they were: level, stars, kit and kills."]},{"v":"2.26.24","items":["The last of the old drag overlay is gone from the battlefield: no gold band or dashed half-way line when you tap to volley."]},{"v":"2.26.23","items":["Tapping on the battlefield no longer flashes the old drag overlay (\"Enemy side\" and the bond hints). Men are moved on the Formation screen.","A tap on one of your men who is buried under enemies now looses a volley there instead of opening his details."]},{"v":"2.26.22","items":["Women with long hair no longer look bearded: the hair now hangs either side of the face, not under the chin."]},{"v":"2.26.21","items":["Ending a campaign now clears the build queue along with the buildings. Jobs left over from an earlier campaign finish on the new level's timer, so early buildings are quick again."]},{"v":"2.26.20","items":["The Quartermaster: once you have a Storehouse and have reached stage 20, the Camp page lets you buy food, wood, iron and feathers with silver, a tenth of the store at a time. The price rises with the campaign, so it is never a bargain, but a full purse now builds things.","Writs climb in price more gently each time you buy one, and there is a Buy 10 button once you can afford ten."]},{"v":"2.26.19","items":["Companies that were already on the march before the Tale began now get a prologue: what Riles pieced together of the earlier campaigns, and the names of the men buried before his time.","Beating a region boss again after you have gone past it no longer writes a chapter. A chapter written that way, running backwards, is corrected."]},{"v":"2.26.18","items":["The roll of honour now names only men who fell in the line. Those lost with the forlorn hope are counted in one line beneath the heading."]},{"v":"2.26.17","items":["Save slots are always shown in Settings, and any slot you are not playing can be deleted, from this device and from your account. To delete the game you are playing, use Start over."]},{"v":"2.26.16","items":["Earlier chapters of the Tale stay open when you tap them.","The first chapter of a campaign now covers it from stage 1, not from the stage it ended on. Older chapters are corrected."]},{"v":"2.26.15","items":["Men out on an expedition can no longer be paid off, singly or in bulk, or picked for a hanging. Their page says they are away."]},{"v":"2.26.14","items":["The featured hero card now says a third, not half, to match the odds since 2.26.5."]},{"v":"2.26.13","items":["The Doc and Fire arrows buttons on the battlefield are bigger and easier to tap."]},{"v":"2.26.12","items":["When every man is wounded, the battlefield stays put until someone is fit again, instead of jumping to a new road every couple of seconds.","Explosions, burning and damage numbers now play at normal speed even at 3x or 5x, so you can see the barrels go off."]},{"v":"2.26.11","items":["New players play at normal speed until they beat the first boss at stage 10. Then 2× unlocks."]},{"v":"2.26.10","items":["Stages 1 to 10 take longer: each brings ten more men, spaced out, so the early fights last long enough to work out what is going on. The extra men taper off by stage 20.","Early ordinary stages are a little tougher, while early bosses stay close to the stage before them, so they are not a wall. Kills pay more where enemies are tougher."]},{"v":"2.26.9","items":["The first hour is slower. Stages 1 to 10 are as quick as before, then enemies toughen faster up to stage 40 and ease back to the usual curve by 70. Buildings now unlock across the first hour or so instead of in the first 15 minutes. Late game is unchanged."]},{"v":"2.26.8","items":["The stage name no longer disappears when the News button shows up. On narrow phones the buttons move to a second row instead."]},{"v":"2.26.7","items":["St Crispin's Eve free levels now stop at the same ceiling as the practice butts."]},{"v":"2.26.6","items":["Practice butts now train the weakest man in the line, up to a ceiling of level 20 plus 5 per butts level (95 at level 15). Above that, levels are paid for. Men already past it keep their levels."]},{"v":"2.26.5","items":["Tips about new features no longer pop up over what you are doing. They wait in a small banner above the bottom bar: Read when you like, or Dismiss. At most one a minute.","Legendary draws no longer hand you a hero who is already at 7 stars while others can still grow. The featured hero comes up a third of the time instead of half, and heroes you do not have yet get most of the rest.","The first piece of camp news now arrives within half a minute of the card that tells you about it, and the card explains that the News button comes and goes."]},
{"v":"2.26.3","items":["On phones the Camp opens as a list again; the village map is a tap away with the Map button. Computers still open on the map, and each device remembers which you picked.","A building page opened from the map now lights up its Upgrade button as soon as you can afford it."]},
{"v":"2.26.2","items":["The event shop now sells Ten medals five times a week and writs ten times a week. Tokens beyond that go on gear and the featured Legendary."]},
{"v":"2.26.1","items":["Headquarters can now correct a company's medals as well as send them."]},
{"v":"2.26","items":["The Tale of the Company: Riles writes a chapter of your company's story each time you beat a region's boss, and when a campaign ends. The weddings, hangings, nicknames and drinking matches, the deadliest man, the dead, and a few numbers he finds funny. Read it on the Captain page.","A Formation screen: tap Formation above the battlefield (or on the Company page) to arrange your men on a quiet copy of the map. Changes take effect at once during the break between stages, otherwise from the next fight.","Men can no longer be dragged on the live battlefield, so tapping near your archers always looses a volley. Tap right on a man to see his details.","When zoomed in, a Zoom out button replaces the double tap, so two quick taps are always two volleys.","A company held at a boss stage it already beats no longer prints medals: full boss medals come the first time you beat each boss in a campaign, and after that only the usual medal for every ten wins."]},
{"v":"2.25.4","items":["While you drag a man, he and the hints stay on top of everyone else, so nothing hides them. Moving men no longer piles up Front and Back messages, even while paused."]},
{"v":"2.25.2","items":["Bonds on the battlefield are much quieter: just a faint coloured line between bonded men standing together. Drag or tap a man to see who he is tied to (they get a ring), with one short line of text."]},
{"v":"2.25.1","items":["Bonds show on the battlefield. Friends (+6%), married couples (+10%) and feuding men (-6%) standing close together are joined by a coloured line with their bonus.","While you drag a man, dashed lines point to everyone he is tied to, so you can see who to put him next to and who to keep him away from.","Tap an archer to see his bonds and whether they count right now."]},
{"v":"2.25","items":["Place your men anywhere on your half of the battlefield: drag an archer to a new spot, or drop him on another man to swap them. A shaded band shows the front while you drag.","Within 50 paces of the road counts as the front: +20% damage, but you get charged. The front has room for five; crowd more in and the bonus is shared between them.","Hold the road: if fewer than three men stand at the front, the French leave the road and hunt the rest of your company.","Bunching up has a price: a cavalry charge or a crossbow bolt now hurts the men standing next to the one it hits.","Your formation stays put from stage to stage, and keeps its shape when the road changes every ten stages. Reset to ranks on the Company page puts everyone back.","Friends and couples get their bonus when they stand close together, wherever that is. Best men forward fills the places nearest the road with your toughest men.","Time away is worked out as before, from your company's strength, so a clever formation helps while you watch but does not change overnight progress."]},
{"v":"2.24.2","items":["The village map no longer flickers every couple of seconds."]},
{"v":"2.24.1","items":["The village is redrawn in the same style as the battlefield: the same grass, road, trees and shadows, buildings seen from above, and your own men wandering between them.","The camp is alive: the fire flickers, chimneys smoke, geese waddle round their pen, the river runs and arrows fly at the butts."]},
{"v":"2.24","items":["The village: the Camp tab now shows your camp as a map. Every building is drawn and grows as you upgrade it, from a lone tent to a row of them, from one strip of field to many.","Tap any building on the map to see what it does and upgrade it. A gold arrow means you can afford an upgrade; a ring shows work in progress.","Plots for buildings you have not reached yet are marked with the stage they unlock at. Some camp followers show up too, if you have them.","Prefer the old way? The List button above the map brings it back."]},
{"v":"2.23.2","items":["A tidy-up pass. The welcome and How to play text now mention the things you can do mid-fight, and holding after a defeat.","The Orders and Captain cards, the Centenar rank and the Orders tab describe what is really there now. Duke gives one more builder, not a fourth.","The Captain button appears once your captain does, at stage 15, instead of sitting there doing nothing."]},
{"v":"2.23.1","items":["Upgrade buttons bounce and the building's card lights up when you press them.","The red dot on the Captain button now only means a raid is ready. Orders are optional, so they no longer nag."]},
{"v":"2.23","items":["Pitch barrels: from stage 12, two or three barrels of pitch sit by the road in every battle. Tap one to blow it up, or leave it and it goes off when a crowd of French gathers round it. The ground burns afterwards.","Fire arrows: from stage 22, tap Fire arrows under the Volleys counter to light every arrow in the line for 8 seconds. Burning arrows splash and set men alight, and burning men keep burning. Two per battle, three once the Fletcher reaches level 30.","The trebuchet throws fire pots now: every stone leaves the ground burning where it lands.","Explosions have their own sound.","The captain's record says Deadliest woman when she is one, and no longer counts friends recruited."]},
{"v":"2.22","items":["Orders from the Constable: three small orders every day on the Orders tab, such as win battles, train archers or settle camp matters. Each pays a writ and medals, and finishing all three pays a bonus of 2 writs and three times the medals.","Every order can be done while your company is held at a wall, and if you miss a day nothing is lost. There are no streaks to break.","These replace the King's orders. Any King's order you had finished but not claimed has been paid out.","Your captain is easier to find: the rank at the top is now a Captain button, with a red dot when an order or a raid is ready.","Upgrade buttons tell you what happened: upgraded, work started (and how long), or which resource you are short of.","Volleys hit much harder: they now count front-rank and arrow bonuses, and plunging arrows half ignore armour."]},
{"v":"2.21","items":["More ways to earn medals. Farming a stage you have already beaten pays a medal every 10 clears, offline too, so a company held at a wall still earns.","The forlorn hope, a new order: up to six spare Common and Uncommon men outside the line storm a breach. Each one pays medals, living or dead. Most do not come back; the few who do gain 5 levels and the name \"of the Breach\".","Promotions up to 3 stars now cost silver and iron only. Medals are needed from 4 stars.","Two more orders: Drill at dawn (a level for every man in the line) and Double rations (morale, at the cost of food).","Six new camp stories with clear Feared, Loved, Fair or Harsh choices, and the choice buttons now say which way each one leans.","The captain page shows the reward at every end of both reputation scales. There is no wrong way to lead.","Every pop-up has a close button in the corner.","Women in helmets and caps no longer look like bearded men. Sorry, Ellen.","Now and then a rider may arrive from headquarters with a purse of medals."]},
{"v":"2.20.1","items":["After a loss the company now holds at the last stage it beat and stays there, farming, until you press Push on. No more waking up to a company that threw itself at the same wall all night.","A 10-second break between stages while you are watching, to upgrade and swap. Tap the field to skip it, or turn it off in Settings.","The Tavern opens at stage 5 instead of 8, so you can recruit reserves sooner.","Faces show the mood of the camp: smiles and grins when morale is high, long faces when it is low, and a green tinge for the hungover."]},
{"v":"2.20","items":["Camp life: your company has a mood. Morale, on the Company page, rises with victories, ale, pay and kindness and falls with deaths, defeats and the whip. High spirits add up to 10% damage; a mutinous company loses 15%.","Twenty-seven new camp events, and most of them leave a mark: weddings, feuds, friendships, ballads, deserters, an outlaw, a drinking match, the pledge, a feast and, if you let things slide, mutiny.","Drink and hangovers: a hungover archer shoots 20% worse until it wears off. Drunkards who take the pledge can become Teetotal.","Camp followers: seven people can join the baggage train for good, each with a lasting benefit. A cook, a laundress, a herbwife, an alewife, a sutler, a chaplain and a fletcher's boy.","Women in the company: about one recruit in five is now a woman, and one may turn up at the muster.","A faster start: wounds early on heal in seconds (full length only from stage 50), nobody can be killed outright before stage 30, and if the company drops below three men a local volunteers.","Early upgrades are instant again: every building's first 15 levels (the first level of capped buildings like the Barracks) finish straight away. Timers only start once buildings get bigger.","Every archer now has a face of their own, built from parts: hair, beards, scars, broken noses, eye patches and a drinker's red nose."]},
{"v":"2.19","items":["Eight new regions past stage 120, from Cravant and Patay to Castillon, then the old soldiers' tales of Crécy and Poitiers: new stages up to 200 before the war starts round again.","Your captain: tap your rank at the top of the screen. Earn experience from every fight and decision and rise from Vintenar to King, with a reward at each rank. Experience is never lost.","Reputation: your choices make the men see you as Harsh or Fair, Feared or Loved, and each has its upside.","From Centenar, give orders: flog the slackers, a day off, a night at the tavern, or a bonus.","From Captain of Archers, lead raids through the French countryside for rich loot, at a cost to your good name.","Your record and best men on the captain page, and tap a name in the King's League to see their captain and army."]},
{"v":"2.18.5","items":["Doc now has three heals per battle instead of a recharge timer, so choose who gets them. The Barber-surgeon adds one more every three levels, up to six."]},
{"v":"2.18.4","items":["A row under the battlefield shows every archer in the line with their health, so you can see who is in trouble even in a crowd. Tap a name to see their card.","Doc now treats one archer at a time: tap Doc, then tap who needs him. He recharges faster to make up for it."]},
{"v":"2.18.3","items":["A banner now tells you when a new version is ready, and Settings shows your version with a Check now button."]},
{"v":"2.18.2","items":["Buildings with a top level (Barracks, Tavern, Drill yard, Barber-surgeon) now take longer the nearer they get to it. The last Barracks level takes eight hours."]},
{"v":"2.18.1","items":["Each kind of expedition can only be out once at a time."]},
{"v":"2.18","items":["On a computer the game now uses the whole window: the battlefield stays on the left and keeps fighting while you run the Camp, Company and the rest on the right. Phones are unchanged."]},
{"v":"2.17","items":["A new Legendary has joined the company: Alex, the Sleepless. Her special, Up till three, keeps the whole line loosing at three times the pace.","Friends of the company: thirteen named archers can now turn up at the Tavern as Rare or Epic recruits, each with their own story.","New faces around camp: Doc the medic, Grim the Master Pintsman, Gaz the Chapman, Scott on the drill yard, Ross Taylor and his trebuchet, and Riles keeping the Chronicle.","A new camp event: the Hermit."]},
{"v":"2.16","items":["Building upgrades now take time, with a progress bar. Two builders work at once (three from stage 60), and medals finish a job straight away. Jobs carry on while you are away.","Fallen Legendaries can be brought back from the Roll of Honour for medals. They return wounded and a little weaker. Everyone else who falls stays fallen.","The medic: from stage 25, tap Medic on the battlefield to patch up the line and get downed men back up. It recharges slowly.","Boss fights have their own, angrier music.","Full-screen button above the battlefield hides everything but the fight."]},
{"v":"2.15","items":["Three save slots: keep your current game and start fresh alongside it (Settings, after your first campaign).","New recruits all start at 1 star; rarity sets how high they can climb.","Event stages show which main stage they match, and events can run at 5x speed.","Pause button above the battlefield.","Drag gear straight from one archer to another in the Equipment list.","Features now open one at a time, each with a short card explaining it."]},
{"v":"2.14","items":["New releases are now offered, not forced: tap Update when you're ready.","Release notes like these show what changed."]},
{"v":"2.13.1","items":["Battle clock on screen; bosses get three minutes; running out says 'Out of time'.","Sound starts on your first tap after opening the game."]},
{"v":"2.13","items":["Rebalanced: billmen and the trebuchet follow your archers' strength; enemies toughen faster past stage 100; fewer event tokens.","Pay off a whole rarity at once from the Company tab.","Tap the field to loose a volley; tap an archer for their card; pinch or scroll to zoom.","Duplicates past 7 stars give +3% damage each."]}
]</script>
