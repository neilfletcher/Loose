<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loose! Admin</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#10140f;--p:#192117;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:"IM Fell English SC",serif;font-weight:400;font-size:36px;margin:0}
h1 b{color:var(--red)}
h2{font-size:12px;letter-spacing:.12em;color:var(--mut);margin:28px 0 10px}
.sub{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--mut);font-size:12px}
.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:14px}
.bars .r{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.bars .r i{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,#c8372d,#e8b64c)}
.bars .r span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
button{font:inherit;font-weight:700;background:linear-gradient(#f0c35c,#c08a26);color:#22170a;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.note{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1 style="flex:1">Loose<b>!</b> Admin</h1><div id="auth"></div></div>
  <div class="sub">Who is playing, how far they get, and where they stop. Players are anonymous; these figures update every few minutes while people play.</div>
  <div id="out"><p class="note">Loading...</p></div>
</div>
<script>
const FB = {apiKey:'AIzaSyC8t1QwGPsrX5cJ6TzwcXrVU6s4rzvFJnU', authDomain:'until-crispins-day.firebaseapp.com', projectId:'until-crispins-day', storageBucket:'until-crispins-day.firebasestorage.app', messagingSenderId:'685836725383', appId:'1:685836725383:web:11118b2daa8cd2f1eb5c22'};
const ADMIN = 'neil.fletcher@gmail.com';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = s => s < 3600 ? Math.round(s / 60) + 'm' : (s / 3600).toFixed(1) + 'h';
const ago = t => { const s = (Date.now() - t) / 1000; return s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const RNAMES = {a1:'Fletching drills',a2:'Bodkin points',a3a:'Longbow mastery',a3b:'Rapid drill',a4:'Clothyard shafts',a5:'Hail of arrows',a6:'Agincourt veterans',l1:'Crop rotation',l2:'Charcoal burning',l3a:'Granary carts',l3b:"Quartermaster's tally",l4:'Goose husbandry',l5:'Scribes',l6:'Royal purveyance',c1:'Company banners',c2:'Captains of twenty',c3a:'Stand fast',c3b:'Loose order',c4:"Surgeons' guild",c5:'Sergeants',c6:'Royal household'};
const BNAMES = {farm:'Farms',woodcut:'Woodcutters',store:'Storehouse',mine:'Iron mine',geese:'Goose pens',fletcher:'Fletcher',barracks:'Barracks',drill:'Drill yard',market:'Market',bowyer:'Bowyer',surgeon:'Barber-surgeon',butts:'Practice butts',tavern:'Tavern',scriptorium:'Scriptorium',bill:'Billmen',pavise:'Pavise-bearers',treb:'Trebuchet'};
function bars(rows){ const max = Math.max(1, ...rows.map(r => r[1])); return `<div class="bars">${rows.map(([l, v, lab]) => `<div class="r"><span>${esc(l)}</span><span><i style="width:${100 * v / max}%"></i></span><span>${lab != null ? lab : v}</span></div>`).join('')}</div>`; }
firebase.initializeApp(FB);
const auth = firebase.auth(), db = firebase.firestore();
auth.onAuthStateChanged(async u => {
  if (!u) { $('auth').innerHTML = '<button id="in">Sign in with Google</button>'; $('out').innerHTML = '<p class="note">Sign in to see the figures.</p>'; $('in').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => $('out').innerHTML = `<p class="note">${esc(e.message)}</p>`); return; }
  $('auth').innerHTML = `<span class="sub">${esc(u.email)}</span> <button id="outb" style="padding:6px 10px">Sign out</button>`; $('outb').onclick = () => auth.signOut();
  if (u.email !== ADMIN) { $('out').innerHTML = '<p class="note">This account is not allowed to see the figures.</p>'; return; }
  try {
    const snap = await db.collection('loose_players').get();
    const P = []; snap.forEach(d => { const x = d.data(); x.id = d.id; P.push(x); });
    render(P);
  } catch (e) { $('out').innerHTML = `<p class="note">Could not read the figures. The database rules may not be in place yet. (${esc(e.message)})</p>`; }
});
/* one row per person: saves from the same device (save slots) are merged, keeping the furthest-along save and summing feature use */
function people(all){
  const by = {}; all.forEach(p => { const k = p.dev || p.id; (by[k] = by[k] || []).push(p); });
  return Object.values(by).map(list => { const top = [...list].sort((a, b) => (b.best || 0) - (a.best || 0))[0], tr = {};
    list.forEach(p => { for (const k in (p.tr || {})) tr[k] = (tr[k] || 0) + p.tr[k]; });
    return Object.assign({}, top, {tr, saves:list.length, last:Math.max(...list.map(p => p.last || 0)), v:[...list].sort((a, b) => (b.last || 0) - (a.last || 0))[0].v, play:list.reduce((t, p) => t + (p.play || 0), 0)}); });
}
const FEAT = [['volley', 'Tapped a volley'], ['volleyAuto', 'Let volleys fire themselves'], ['medic', 'Called Doc (medic)'], ['archerTap', 'Tapped an archer'], ['zoom', 'Zoomed the battlefield'], ['pause', 'Paused'], ['fullscreen', 'Went full screen'], ['gearDrag', 'Dragged gear between archers'], ['bulkPay', 'Paid off in bulk'], ['timedBuild', 'Started a timed upgrade'], ['rush', 'Finished an upgrade with medals'], ['revive', 'Brought back a Legendary'], ['slotSwitch', 'Switched save slot'], ['update', 'Installed an update'], ['cardShow', 'Pressed "Show me" on a New card'], ['newsChoice', 'Made a camp-news choice'], ['order_flog', 'Ordered a flogging'], ['order_rest', 'Gave a day off'], ['order_ale', 'Sent the men to the tavern'], ['order_pay', 'Paid a bonus'], ['raid', 'Led a raid'], ['rivalView', "Looked at another captain's page"], ['rankUp', 'Was promoted'], ['follower', 'Took on a camp follower'], ['hangover', 'Had a hungover archer'], ['bond_w', 'Married two archers'], ['bond_f', 'Made two archers friends in camp'], ['bond_g', 'Started a feud in camp'], ['hanged', 'Hanged a deserter or mutineer'], ['nick', 'Earned a nickname at camp'], ['ev_mutiny', 'Faced a mutiny']];
const FRIENDN = {bobby:'Bobby Arrow', col:'Col the Man', cras:'Nick Cras', curio:'Curio the Wastrel', davpaz:'Dav Paz', jasmine:'Jasmine the Goddess', jacket:'Nick "Jacket" Stewart', joans:'Old Joans', wookie:'Wookie the Underling', mali:'Mali of Aldgate', nase:'Tony Nason', trousers:'Trousers', zaphod:'Zaphod'};
function render(ALL){
  const P = people(ALL);
  const now = Date.now(), day = 864e5;
  const act1 = P.filter(p => now - p.last < day).length, act7 = P.filter(p => now - p.last < 7 * day).length;
  const bests = P.map(p => p.best || 1).sort((a, b) => a - b), median = bests.length ? bests[Math.floor(bests.length / 2)] : 0;
  const play = P.map(p => p.play || 0), avgPlay = play.length ? play.reduce((a, b) => a + b, 0) / play.length : 0;
  const signed = P.filter(p => p.signed).length, mobile = P.filter(p => p.mobile).length;
  // funnel: where people stop (best stage buckets)
  const buckets = [[1, 4], [5, 9], [10, 19], [20, 29], [30, 39], [40, 59], [60, 79], [80, 99], [100, 149], [150, 1e9]];
  const funnel = buckets.map(([a, b]) => [b > 1e8 ? `${a}+` : `${a} to ${b}`, P.filter(p => (p.best || 1) >= a && (p.best || 1) <= b).length]);
  const reached = [10, 20, 30, 40, 60, 80, 100, 150].map(s => [`Stage ${s}`, P.filter(p => (p.best || 1) >= s).length, P.length ? Math.round(100 * P.filter(p => (p.best || 1) >= s).length / P.length) + '%' : '0%']);
  const prest = [0, 1, 2, 3, 5, 10].map((n, i, arr) => { const hi = arr[i + 1] ? arr[i + 1] - 1 : 1e9; return [hi > 1e8 ? `${n}+` : n === hi ? String(n) : `${n} to ${hi}`, P.filter(p => (p.prestiges || 0) >= n && (p.prestiges || 0) <= hi).length]; });
  const bld = Object.keys(BNAMES).map(k => { const v = P.map(p => (p.bld && p.bld[k]) || 0); return [BNAMES[k], v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0]; }).sort((a, b) => b[1] - a[1]).map(([n, v]) => [n, v, v.toFixed(1)]);
  const rc = {}; P.forEach(p => (p.research || '').split(',').filter(Boolean).forEach(id => rc[id] = (rc[id] || 0) + 1));
  const res = Object.keys(RNAMES).map(k => [RNAMES[k], rc[k] || 0]).filter(r => r[1] > 0 || ['a3a','a3b','l3a','l3b','c3a','c3b'].includes(Object.keys(RNAMES).find(x => RNAMES[x] === r[0])));
  const recent = [...P].sort((a, b) => b.last - a.last).slice(0, 30);
  const pct = n => P.length ? Math.round(100 * n / P.length) + '%' : '0%';
  const feat = FEAT.map(([k, l]) => { const n = P.filter(p => (p.tr || {})[k] > 0).length, tot = P.reduce((t, p) => t + ((p.tr || {})[k] || 0), 0); return [l, n, `${pct(n)} · ${tot} times`]; });
  const vers = {}; P.forEach(p => vers[p.v || '?'] = (vers[p.v || '?'] || 0) + 1);
  const vrows = Object.keys(vers).sort((a, b) => String(b).localeCompare(String(a), undefined, {numeric:true})).map(v => [v, vers[v], pct(vers[v])]);
  const fc = {}; P.forEach(p => (p.friends || '').split(',').filter(Boolean).forEach(f => fc[f] = (fc[f] || 0) + 1));
  const frows = Object.keys(FRIENDN).map(k => [FRIENDN[k], fc[k] || 0]).sort((a, b) => b[1] - a[1]); frows.unshift(['Alex the Sleepless (Legendary)', P.filter(p => p.alex).length]);
  const tutDone = P.filter(p => (p.tut || 0) >= 99).length, multi = P.filter(p => p.saves > 1).length;
  const ev = [[1, 9], [10, 19], [20, 29], [30, 49], [50, 1e9]].map(([a, b]) => [b > 1e8 ? `${a}+` : `${a} to ${b}`, P.filter(p => (p.evBest || 0) >= a && (p.evBest || 0) <= b).length]);
  const RANKN = ['Vintenar','Centenar','Captain of Archers','Knight','Knight Banneret','Baron','Earl','Duke','Prince of the Blood','King'];
  const CP = P.filter(p => p.mor !== undefined);
  const morq = [['In fine heart (80+)', p => p.mor >= 80], ['Cheerful (65 to 79)', p => p.mor >= 65 && p.mor < 80], ['Steady (35 to 64)', p => p.mor >= 35 && p.mor < 65], ['Grumbling (20 to 34)', p => p.mor >= 20 && p.mor < 35], ['Mutinous (under 20)', p => p.mor < 20]].map(([l, f]) => [l, CP.filter(f).length]);
  const FOLN = {laund:'Laundress', herb:'Herbwife', alewife:'Alewife', cook:'Cook', sutler:'Sutler', boy:"Fletcher's boy", priest:'Chaplain'};
  const folr = Object.keys(FOLN).map(k => { const n = CP.filter(p => (p.fol || '').split(',').includes(k)).length; return [FOLN[k], n, CP.length ? `${n} · ${Math.round(100 * n / CP.length)}%` : n]; });
  const evk = {}; CP.forEach(p => Object.keys(p.tr || {}).filter(k => k.startsWith('ev_') && k !== 'ev_old').forEach(k => evk[k] = (evk[k] || 0) + p.tr[k]));
  const evr = Object.entries(evk).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([k, v]) => [k.slice(3), v]);
  const wom = CP.reduce((t, p) => t + (p.women || 0), 0), rost = CP.reduce((t, p) => t + (p.roster || 0), 0);
  const ranks = RANKN.map((n, i) => [n, P.filter(p => (p.capRank || 0) === i).length]);
  const repq = [['Fair and loved', p => (p.fair || 0) >= 20 && (p.love || 0) >= 20], ['Fair and feared', p => (p.fair || 0) >= 20 && (p.love || 0) <= -20], ['Harsh and loved', p => (p.fair || 0) <= -20 && (p.love || 0) >= 20], ['Harsh and feared', p => (p.fair || 0) <= -20 && (p.love || 0) <= -20], ['Somewhere in between', p => Math.abs(p.fair || 0) < 20 || Math.abs(p.love || 0) < 20]].map(([l, f]) => [l, P.filter(f).length]);
  const rushM = P.reduce((t, p) => t + ((p.tr || {}).rushMedals || 0), 0);
  $('out').innerHTML = `
  <div class="kpis"><div class="kpi"><b>${P.length}</b><span>players ever (one per device)</span></div><div class="kpi"><b>${act1}</b><span>played in the last day</span></div><div class="kpi"><b>${act7}</b><span>played in the last week</span></div><div class="kpi"><b>${median}</b><span>median best stage</span></div><div class="kpi"><b>${fmtT(avgPlay)}</b><span>average time played</span></div><div class="kpi"><b>${P.length ? Math.round(100 * signed / P.length) : 0}%</b><span>signed in · ${P.length ? Math.round(100 * mobile / P.length) : 0}% on phones</span></div></div>
  <div class="two"><div><h2>WHERE PEOPLE STOP (BEST STAGE)</h2><div class="card">${bars(funnel)}</div></div><div><h2>HOW MANY GET THIS FAR</h2><div class="card">${bars(reached)}</div></div></div>
  <div class="two"><div><h2>CAMPAIGNS ENDED (PRESTIGE)</h2><div class="card">${bars(prest)}</div></div><div><h2>AVERAGE BUILDING LEVEL</h2><div class="card">${bars(bld)}</div></div></div>
  <h2>RESEARCH TAKEN (INCLUDING THE CHOICES)</h2><div class="card">${bars(res)}</div>
  <div class="kpis"><div class="kpi"><b>${pct(tutDone)}</b><span>finished the tutorial</span></div><div class="kpi"><b>${multi}</b><span>players using more than one save slot</span></div><div class="kpi"><b>${rushM}</b><span>medals spent finishing upgrades</span></div><div class="kpi"><b>${ALL.length}</b><span>saves in total</span></div><div class="kpi"><b>${pct(P.filter(p => p.wide).length)}</b><span>use the wide computer layout</span></div></div>
  <h2>FEATURE USE (PLAYERS WHO HAVE TRIED IT)</h2><div class="card">${bars(feat)}</div>
  <div class="two"><div><h2>VERSIONS IN USE</h2><div class="card">${bars(vrows)}</div></div><div><h2>BEST WEEKLY EVENT STAGE</h2><div class="card">${bars(ev)}</div></div></div>
  <div class="two"><div><h2>CAPTAIN RANKS</h2><div class="card">${bars(ranks)}</div></div><div><h2>REPUTATION</h2><div class="card">${bars(repq)}</div></div></div>
  <div class="two"><div><h2>MORALE (2.20 AND LATER)</h2><div class="card">${bars(morq)}</div></div><div><h2>CAMP FOLLOWERS TAKEN ON</h2><div class="card">${bars(folr)}</div></div></div>
  <div class="two"><div><h2>NEW CAMP EVENTS SEEN MOST</h2><div class="card">${evr.length ? bars(evr) : '<div class="sub">None yet.</div>'}</div></div><div><h2>WOMEN IN THE COMPANY</h2><div class="card"><div style="font-size:28px;font-weight:700">${rost ? Math.round(100 * wom / rost) : 0}%</div><div class="sub">${wom} women across ${rost} archers on players' rolls (2.20 and later)</div></div></div></div>
  <h2>FRIENDS OF THE COMPANY RECRUITED</h2><div class="card">${bars(frows)}</div>
  <h2>MOST RECENT PLAYERS</h2><div class="card scroll"><table><thead><tr><th>Last seen</th><th>Best</th><th>Now at</th><th>Campaigns</th><th>Time played</th><th>Roll</th><th>Legendaries</th><th>Fallen</th><th>Device</th><th>Account</th><th>Version</th><th>Saves</th></tr></thead>
  <tbody>${recent.map(p => `<tr><td>${ago(p.last)}</td><td class="n">${p.best || 1}</td><td class="n">${p.stage || 1}</td><td class="n">${p.prestiges || 0}</td><td class="n">${fmtT(p.play || 0)}</td><td class="n">${p.roster || 0}</td><td class="n">${p.heroes || 0}</td><td class="n">${p.fallen || 0}</td><td>${p.mobile ? 'Phone' : p.wide ? 'Computer (wide)' : 'Computer'}</td><td>${p.signed ? 'Yes' : 'No'}</td><td>${esc(p.v || '')}</td><td class="n">${p.saves || 1}</td></tr>`).join('')}</tbody></table></div>`;
}
</script>
</body>
</html>
