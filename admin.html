<style>
:root{--bg:#10140f;--p:#192117;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:"IM Fell English SC",serif;font-weight:400;font-size:36px;margin:0}
h1 b{color:var(--red)}
h2{font-size:12px;letter-spacing:.12em;color:var(--mut);margin:28px 0 10px}
.sub{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
button{font:inherit;font-weight:700;background:linear-gradient(#f0c35c,#c08a26);color:#22170a;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.note{color:var(--mut)}
</style>
</head>

const FEAT = [['src_itch', 'Playing the itch.io copy (2.29)'], ['saveBlocked', 'Browser would not keep the save (2.30)'], ['statsOn', 'Turned play stats back on (2.29)'], ['adDone_offline', 'Watched an advert to double offline gains (2.27)'], ['adDone_rush', 'Watched an advert to hurry a build (2.27)'], ['adDone_writ', 'Watched an advert for a free writ (2.27)'], ['adDone_swap', 'Watched an advert to swap a daily order (2.27)'], ['kofi', 'Opened the Ko-fi page (2.27)'], ['supporter', 'Said they chipped in on Ko-fi (2.27)'], ['volley', 'Tapped a volley'], ['volleyAuto', 'Let volleys fire themselves'], ['medic', 'Called Doc (medic)'], ['archerTap', 'Tapped an archer'], ['zoom', 'Zoomed the battlefield'], ['pause', 'Paused'], ['fullscreen', 'Went full screen'], ['gearDrag', 'Dragged gear between archers'], ['bulkPay', 'Paid off in bulk'], ['timedBuild', 'Started a timed upgrade'], ['rush', 'Finished an upgrade with medals'], ['revive', 'Brought back a Legendary'], ['slotSwitch', 'Switched save slot'], ['update', 'Installed an update'], ['cardShow', 'Pressed "Show me" on a New card'], ['newsChoice', 'Made a camp-news choice'], ['order_flog', 'Ordered a flogging'], ['order_rest', 'Gave a day off'], ['order_ale', 'Sent the men to the tavern'], ['order_pay', 'Paid a bonus'], ['raid', 'Led a raid'], ['rivalView', "Looked at another captain's page"], ['rankUp', 'Was promoted'], ['follower', 'Took on a camp follower'], ['hangover', 'Had a hungover archer'], ['bond_w', 'Married two archers'], ['bond_f', 'Made two archers friends in camp'], ['bond_g', 'Started a feud in camp'], ['hanged', 'Hanged a deserter or mutineer'], ['nick', 'Earned a nickname at camp'], ['ev_mutiny', 'Faced a mutiny'], ['pushOn', 'Pressed Push on after a loss'], ['breakSkip', 'Skipped the break between stages'], ['breakToggle', 'Changed the break setting'], ['farmMedal', 'Earned medals by farming'], ['buttsLvl', 'Free levels from the butts'], ['spdLocked', 'Tried 2× before the first boss'], ['slotDelete'   const reached = [10, 20, 30, 40, 60, 80, 100, 150].map(s => [`Stage ${s}`, P.filter(p => (p.best || 1) >= s).length, P.length ? Math.round(100 * P.filter(p => (p.best || 1) >= s).length / P.length) + '%' : '0%']);
